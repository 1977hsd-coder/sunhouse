                                        <div className="flex items-center gap-1">
                                            <label className="text-gray-600">부서:</label>
                                            <input type="number" value={reportColWidths.dept} onChange={e => setReportColWidths({...reportColWidths, dept: Number(e.target.value)})} className="w-12 p-1 border rounded text-center outline-none focus:ring-1 focus:ring-blue-500" />
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap gap-2 w-full xl:w-auto">
                                        <input type="month" value={currentMonth} onChange={e => setCurrentMonth(e.target.value)} className="p-2 border rounded-lg shadow-sm flex-1 xl:flex-none font-medium outline-none focus:ring-2 focus:ring-blue-500" />
                                        <button onClick={() => handlePrintInNewWindow('printable-report-area', '월별 재고관리 대장')} className="bg-slate-800 text-white px-5 py-2 rounded-lg flex items-center justify-center gap-2 shadow-md hover:bg-slate-700 transition-colors flex-1 xl:flex-none font-bold whitespace-nowrap"><Printer size={18} /> 인쇄하기 (새창)</button>
                                    </div>
                                </div>
                                <div id="printable-report-area">
                                    {reportPages.map((pageData, pageIndex) => (
                                        <div key={pageIndex} className={`report-page bg-white p-4 text-black border border-gray-200 rounded-lg shadow-sm ${pageIndex > 0 ? 'page-break pt-16' : ''} relative pb-12`}>
                                            <div className="relative pt-4 mb-4">
                                                <div className="absolute top-0 left-0 text-base font-bold">동광복지재단 해뜨는집</div>
                                                <div className="flex justify-between items-end">
                                                    <div className="flex-1 text-center">
                                                        <h1 className="text-2xl font-bold underline underline-offset-8">{currentMonth.split('-')[0]}년 {currentMonth.split('-')[1]}월 소모품 재고관리 대장</h1>
                                                    </div>
                                                    
                                                    {pageIndex === 0 && (
                                                        <div className="flex border border-black text-center text-sm ml-4"><div className="w-6 bg-gray-100 flex items-center justify-center border-r border-black font-bold leading-tight">결<br/>재</div><div className="flex"><div className="w-20"><div className="bg-gray-100 border-b border-black py-1">담 당</div><div className="h-16"></div></div><div className="w-20 border-l border-black"><div className="bg-gray-100 border-b border-black py-1">국 장</div><div className="h-16"></div></div><div className="w-20 border-l border-black"><div className="bg-gray-100 border-b border-black py-1">원 장</div><div className="h-16"></div></div></div></div>
                                                    )}
                                                </div>
                                            </div>
                                            
                                            <table className="w-full border-collapse border border-black text-center text-xs md:text-sm mb-4">
                                                <thead>
                                                    <tr className="bg-gray-100">
                                                        <th rowSpan="2" className="border border-black p-1" style={{ width: `${reportColWidths.no}px` }}>No</th>
                                                        <th rowSpan="2" className="border border-black p-1" style={{ width: `${reportColWidths.itemName}px` }}>품 명</th>
                                                        <th rowSpan="2" className="border border-black p-1" style={{ width: `${reportColWidths.numbers}px` }}>전월<br/>재고</th>
                                                        <th rowSpan="2" className="border border-black p-1" style={{ width: `${reportColWidths.numbers}px` }}>현<br/>재고</th>
                                                        <th colSpan="2" className="border border-black p-1">입고</th>
                                                        <th rowSpan="2" className="border border-black p-1" style={{ width: `${reportColWidths.numbers}px` }}>총<br/>출고</th>
                                                        <th rowSpan="2" className="border border-black p-1" style={{ width: `${reportColWidths.location}px` }}>보관장소</th>
                                                        <th colSpan={DEPARTMENTS.length} className="border border-black p-1">출고 세부 내역</th>
                                                    </tr>
                                                    <tr className="bg-gray-100">
                                                        <th className="border border-black p-1" style={{ width: `${reportColWidths.numbers}px` }}>구입</th>
                                                        <th className="border border-black p-1" style={{ width: `${reportColWidths.numbers}px` }}>후원</th>
                                                        {DEPARTMENTS.map(d => <th key={d} className="border border-black p-1" style={{ width: `${reportColWidths.dept}px` }}>{d}</th>)}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {pageData.map((item, idx) => (
                                                        <tr key={item.name + idx} className="h-6 text-xs hover:bg-gray-50">
                                                            <td className="border border-black p-1">{(pageIndex * 33) + idx + 1}</td>
                                                            <td className="border border-black p-1 text-left px-2 font-medium overflow-hidden text-ellipsis whitespace-nowrap" style={{ maxWidth: `${reportColWidths.itemName}px` }} title={item.name}>{item.name}</td>
                                                            <td className="border border-black p-1 bg-gray-50">{item.prevStock}</td>
                                                            <td className="border border-black p-1 font-bold bg-blue-50">{item.currentStock < 0 ? 0 : item.currentStock}</td>
                                                            <td className="border border-black p-1 text-green-700">{item.inboundPurchase || ''}</td>
                                                            <td className="border border-black p-1 text-green-700">{item.inboundDonation || ''}</td>
                                                            <td className="border border-black p-1 bg-red-50 text-red-700 font-medium">{item.totalOutbound || ''}</td>
                                                            <td className="border border-black p-1 text-[10px] text-gray-600 overflow-hidden text-ellipsis whitespace-nowrap" style={{ maxWidth: `${reportColWidths.location}px` }} title={item.location}>{item.location}</td>
                                                            {DEPARTMENTS.map(d => (
                                                                <td key={d} className="border border-black p-1 text-gray-700">{item.outboundByDept[d] > 0 ? item.outboundByDept[d] : ''}</td>
                                                            ))}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            <div className="page-footer text-gray-500 font-medium">- {pageIndex + 1} -</div>
                                        </div>
                                    ))}
                                    {reportPages[0] && reportPages[0].length === 0 && (
                                        <div className="p-20 text-center text-gray-400 bg-white border border-gray-200 rounded-lg shadow-sm">해당 월에 보고서 데이터가 없습니다.</div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
