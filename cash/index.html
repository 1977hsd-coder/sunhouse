<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동광복지재단 금전출납부</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SheetJS (Excel .xls / .xlsx 읽기·쓰기 지원) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }

            /* 인쇄 페이지 컨테이너 - A4 가로 높이(210mm)에 맞춰 위아래 시트 폭을 최대한 넓게 배치 (빈 페이지 방지) */
            .print-page {
                width: 297mm;
                height: 209mm;
                padding: 3.5mm 7mm 2.5mm 7mm;
                margin: 0 auto;
                page-break-after: always;
                break-after: page;
                page-break-inside: avoid;
                break-inside: avoid;
                position: relative;
                box-sizing: border-box;
                overflow: hidden;
            }
            .print-page:last-child,
            .print-page.last-page {
                page-break-after: auto !important;
                break-after: auto !important;
            }
        }

        /* 화면 미리보기용 스타일 */
        .preview-container {
            background-color: #525659;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .preview-container .print-page {
            width: 297mm;
            height: 210mm;
            padding: 3.5mm 7mm 2.5mm 7mm;
            background: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        /* 모달 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <div id="error-message" style="display:none; padding: 20px; color: red; background: #ffe6e6; border: 1px solid red; margin: 20px;">
        <h3>오류가 발생했습니다.</h3>
        <pre id="error-detail"></pre>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-detail').textContent = message + '\n라인: ' + lineno;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 구글 시트 연동 설정 ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmiCv86g7KKlS6NlYapvyfPuduBaRWBT6bj0tTh3Ln2QcmEJ_Sdwz_G-2Q-QkaY_ihow/exec";
        const GOOGLE_SHEET_NAME = "cash";

        // 해뜨는집_통합관리_DB (consumables, book, waitlist, cash) 통합 Apps Script 코드
        const GOOGLE_APPS_SCRIPT_CODE = [
            "// 해뜨는집_통합관리_DB 지원 시트: consumables, book, waitlist, cash",
            "const ALLOWED_SHEETS = ['consumables', 'book', 'waitlist', 'cash'];",
            "",
            "function doGet(e) {",
            "  const sheetName = (e && e.parameter && (e.parameter.sheet || e.parameter.sheetName))",
            "    ? (e.parameter.sheet || e.parameter.sheetName)",
            "    : 'consumables';",
            "  const ss = SpreadsheetApp.getActiveSpreadsheet();",
            "  const sheet = ss.getSheetByName(sheetName);",
            "",
            "  if (!sheet) {",
            "    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: sheetName + ' 시트를 찾을 수 없습니다.' }))",
            "      .setMimeType(ContentService.MimeType.JSON);",
            "  }",
            "",
            "  const lastRow = sheet.getLastRow();",
            "  if (lastRow === 0) {",
            "    const emptyObj = sheetName === 'cash' ? { users: [], transactions: [] } : {};",
            "    return ContentService.createTextOutput(JSON.stringify(emptyObj))",
            "      .setMimeType(ContentService.MimeType.JSON);",
            "  }",
            "",
            "  // A열에 나누어 저장된 데이터를 모두 합쳐서 반환",
            "  const values = sheet.getRange(1, 1, lastRow, 1).getValues();",
            "  const rawData = values.map(row => row[0]).join('');",
            "  const output = rawData ? rawData : JSON.stringify(sheetName === 'cash' ? { users: [], transactions: [] } : {});",
            "",
            "  return ContentService.createTextOutput(output)",
            "    .setMimeType(ContentService.MimeType.JSON);",
            "}",
            "",
            "function doPost(e) {",
            "  try {",
            "    const payload = JSON.parse(e.postData.contents);",
            "    const sheetName = payload.sheet || payload.sheetName || 'consumables';",
            "    const targetData = payload.data !== undefined",
            "      ? payload.data",
            "      : (sheetName === 'cash' ? { users: payload.users || [], transactions: payload.transactions || [], savedAt: payload.savedAt || '' } : {});",
            "    const dataString = JSON.stringify(targetData);",
            "",
            "    const ss = SpreadsheetApp.getActiveSpreadsheet();",
            "    let sheet = ss.getSheetByName(sheetName);",
            "    if (!sheet) {",
            "      sheet = ss.insertSheet(sheetName);",
            "    }",
            "",
            "    // 기존 내용 비우고 40,000자씩 나누어 A1, A2, A3...에 저장",
            "    sheet.clearContents();",
            "    const chunkSize = 40000;",
            "    const chunks = [];",
            "    for (let i = 0; i < dataString.length; i += chunkSize) {",
            "      chunks.push([dataString.substring(i, i + chunkSize)]);",
            "    }",
            "",
            "    if (chunks.length > 0) {",
            "      sheet.getRange(1, 1, chunks.length, 1).setValues(chunks);",
            "    }",
            "    sheet.getRange('B1').setValue('최근 동기화: ' + new Date().toLocaleString('ko-KR'));",
            "    sheet.getRange('B2').setValue('분할 저장 칸 수: ' + chunks.length);",
            "    if (sheetName === 'cash' && targetData) {",
            "      sheet.getRange('B3').setValue('이용자 수: ' + ((targetData.users || []).length) + '명 / 거래 내역: ' + ((targetData.transactions || []).length) + '건');",
            "    }",
            "",
            "    return ContentService.createTextOutput(JSON.stringify({ status: 'success', sheet: sheetName, chunks: chunks.length }))",
            "      .setMimeType(ContentService.MimeType.JSON);",
            "  } catch (err) {",
            "    console.error(err);",
            "    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))",
            "      .setMimeType(ContentService.MimeType.JSON);",
            "  }",
            "}"
        ].join("\n");

        // --- 날짜 및 엑셀 파싱 공통 헬퍼 ---
        const formatLocalDate = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const getMonthRange = (year, monthIndex) => {
            const startObj = new Date(year, monthIndex, 1);
            const endObj = new Date(year, monthIndex + 1, 0);
            const ym = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
            return {
                ym,
                start: formatLocalDate(startObj),
                end: formatLocalDate(endObj)
            };
        };

        const getPrevMonthLastDay = (ym) => {
            const [y, m] = ym.split('-').map(Number);
            const prevLast = new Date(y, m - 1, 0);
            return formatLocalDate(prevLast);
        };

        const parseExcelAmount = (val) => {
            if (val === null || val === undefined || val === '') return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : Math.round(val);
            const cleaned = String(val).replace(/[^0-9.\-]/g, '');
            if (!cleaned || cleaned === '-' || cleaned === '.') return 0;
            const num = Number(cleaned);
            return isNaN(num) ? 0 : Math.round(num);
        };

        const parseExcelDate = (val, fallbackYear, fallbackMonth, is1904 = false) => {
            if (val === null || val === undefined || val === '') return null;

            // 1) JS Date 객체인 경우
            if (val instanceof Date && !isNaN(val.getTime())) {
                const y = val.getFullYear();
                const m = val.getMonth() + 1;
                const d = val.getDate();
                if (y >= 1900 && y <= 2100) {
                    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }
            }

            // 2) 숫자인 경우 (YYYYMMDD 8자리 / Excel 시리얼 날짜 / 일자 숫자)
            if (typeof val === 'number' && !isNaN(val)) {
                const intVal = Math.floor(val);
                // 8자리 YYYYMMDD 숫자 (예: 20250315)
                if (intVal >= 19000101 && intVal <= 20991231) {
                    const s = String(intVal);
                    const y = parseInt(s.slice(0, 4), 10);
                    const m = parseInt(s.slice(4, 6), 10);
                    const d = parseInt(s.slice(6, 8), 10);
                    if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    }
                }
                // Excel 시리얼 날짜 (1900 / 1904 시스템 대응)
                if (val > 20000 && val < 90000 && window.XLSX && window.XLSX.SSF) {
                    const serial = is1904 ? val + 1462 : val;
                    const parsed = window.XLSX.SSF.parse_date_code(serial);
                    if (parsed && parsed.y && parsed.m && parsed.d) {
                        return `${parsed.y}-${String(parsed.m).padStart(2, '0')}-${String(parsed.d).padStart(2, '0')}`;
                    }
                }
                // 일자(1~31)만 숫자로 입력된 경우 (시트 월이 있을 때)
                if (Number.isInteger(val) && val >= 1 && val <= 31 && fallbackMonth) {
                    const y = fallbackYear || new Date().getFullYear();
                    return `${y}-${String(fallbackMonth).padStart(2, '0')}-${String(val).padStart(2, '0')}`;
                }
                return null;
            }

            // 3) 문자열인 경우 (요일·공백·끝 마침표 제거 후 파싱)
            const str = String(val)
                .replace(/\([월화수목금토일]\)/g, '')
                .replace(/[월화수목금토일]요일/g, '')
                .trim()
                .replace(/\.+$/, '')
                .trim();
            if (!str) return null;

            // YYYYMMDD (8자리 숫자 문자열)
            if (/^\d{8}$/.test(str)) {
                const y = parseInt(str.slice(0, 4), 10);
                const m = parseInt(str.slice(4, 6), 10);
                const d = parseInt(str.slice(6, 8), 10);
                if (y >= 1900 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }
            }

            // YYYY-MM-DD / YYYY. MM. DD / YYYY/MM/DD / YYYY년 M월 D일
            let match = str.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})\s*일?/);
            if (match) {
                const y = parseInt(match[1], 10);
                const m = parseInt(match[2], 10);
                const d = parseInt(match[3], 10);
                if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }
            }

            // YY-MM-DD / YY. MM. DD / YY/MM/DD
            match = str.match(/^(\d{2})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})$/);
            if (match) {
                const y = parseInt(match[1], 10) >= 70 ? `19${match[1]}` : `20${match[1]}`;
                const m = parseInt(match[2], 10);
                const d = parseInt(match[3], 10);
                if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }
            }

            // MM-DD / M. D / M/D / M월 D일
            match = str.match(/^(\d{1,2})\s*[.\-/월]\s*(\d{1,2})\s*일?$/);
            if (match) {
                const y = fallbackYear || new Date().getFullYear();
                const m = parseInt(match[1], 10);
                const d = parseInt(match[2], 10);
                if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }
            }

            // D일 또는 숫자 일자만 있는 경우 (시트에서 월이 감지된 경우)
            match = str.match(/^(\d{1,2})\s*일?$/);
            if (match && fallbackMonth) {
                const d = parseInt(match[1], 10);
                if (d >= 1 && d <= 31) {
                    const y = fallbackYear || new Date().getFullYear();
                    return `${y}-${String(fallbackMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }
            }

            return null;
        };

        const analyzeExcelWorkbook = (workbook, fileName) => {
            const baseFileName = (fileName || '').replace(/\.(xlsx?|csv)$/i, '').replace(/_금전출납부.*$/i, '').trim();
            const is1904 = Boolean(workbook.Workbook && workbook.Workbook.WBProps && workbook.Workbook.WBProps.date1904);
            let detectedUserName = '';
            let detectedGroup = '';
            let detectedYear = new Date().getFullYear();
            let yearDetectedExplicitly = false;
            const parsedItems = [];
            let initialCarryOver = null;
            const summaryKeywords = ['합계', '소계', '월계', '누계', '총계', '계'];

            workbook.SheetNames.forEach((sheetName) => {
                const sheet = workbook.Sheets[sheetName];
                if (!sheet) return;

                const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
                const formattedRows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
                if (!rows || rows.length === 0) return;

                let sheetYear = detectedYear;
                let sheetMonth = null;

                // 시트 이름에서 연도/월 추출 (예: "2025년 3월", "3월", "03")
                const sheetYearMatch = sheetName.match(/(20\d{2})\s*년?/);
                if (sheetYearMatch) {
                    sheetYear = parseInt(sheetYearMatch[1], 10);
                    detectedYear = sheetYear;
                    yearDetectedExplicitly = true;
                }
                const sheetMonthMatch = sheetName.match(/(?:^|[^0-9])(1[0-2]|0?[1-9])\s*월/);
                if (sheetMonthMatch) {
                    sheetMonth = parseInt(sheetMonthMatch[1], 10);
                } else if (/^(0?[1-9]|1[0-2])$/.test(sheetName.trim())) {
                    sheetMonth = parseInt(sheetName.trim(), 10);
                }

                // 상단 메타데이터 행에서 연도·월·성명·생활실(그룹) 탐색
                for (let r = 0; r < Math.min(10, formattedRows.length); r++) {
                    const fRow = formattedRows[r] || [];
                    const rowJoined = fRow.map(v => String(v || '').trim()).filter(Boolean).join(' ');

                    const yMatch = rowJoined.match(/(20\d{2})\s*년/);
                    if (yMatch) {
                        sheetYear = parseInt(yMatch[1], 10);
                        detectedYear = sheetYear;
                        yearDetectedExplicitly = true;
                    }
                    if (!sheetMonth) {
                        const mMatch = rowJoined.match(/(?:20\d{2}\s*년\s*)?(1[0-2]|0?[1-9])\s*월/);
                        if (mMatch) sheetMonth = parseInt(mMatch[1], 10);
                    }

                    for (let c = 0; c < fRow.length; c++) {
                        const cellText = String(fRow[c] || '').replace(/\s+/g, '');
                        const nextText = String(fRow[c + 1] || '').trim();

                        if (!detectedUserName) {
                            const inlineName = cellText.match(/^(?:성명|이름|이용자명?)[:：](.+)$/);
                            if (inlineName && inlineName[1]) {
                                detectedUserName = inlineName[1].trim();
                            } else if (/^(성명|이름|이용자명?)$/.test(cellText) && nextText && !/^(생활실|그룹|호실|기간)/.test(nextText)) {
                                detectedUserName = nextText;
                            }
                        }
                        if (!detectedGroup) {
                            const inlineGroup = cellText.match(/^(?:생활실|생활관|그룹|호실|생활실\/그룹)[:：](.+)$/);
                            if (inlineGroup && inlineGroup[1]) {
                                detectedGroup = inlineGroup[1].trim();
                            } else if (/^(생활실|생활관|그룹|호실|생활실\/그룹)$/.test(cellText) && nextText && !/^(성명|이름|기간|-)$/.test(nextText)) {
                                detectedGroup = nextText;
                            }
                        }
                    }
                }

                // 헤더 행 탐색 (1행/2행 병합 헤더 및 좌우 분할 통장·현금 테이블 지원)
                let headerRowIdx = -1;
                let dataStartRow = -1;
                const colMap = {
                    date: -1,
                    yearCol: -1,
                    monthCol: -1,
                    dayCol: -1,
                    desc: -1,
                    method: -1,
                    bankDate: -1,
                    bankMonthCol: -1,
                    bankDayCol: -1,
                    bankDesc: -1,
                    bankIncome: -1,
                    bankExpense: -1,
                    bankBalance: -1,
                    cashDate: -1,
                    cashMonthCol: -1,
                    cashDayCol: -1,
                    cashDesc: -1,
                    cashIncome: -1,
                    cashExpense: -1,
                    cashBalance: -1,
                    genericIncome: -1,
                    genericExpense: -1,
                    genericBalance: -1
                };

                for (let r = 0; r < Math.min(18, rows.length); r++) {
                    const rowStrs = (formattedRows[r] || rows[r] || []).map(v => String(v || '').replace(/\s+/g, ''));
                    const hasDate = rowStrs.some(s => /^(일자|날짜|거래일|거래일자|년월일|월\/?일|월)$/.test(s));
                    const hasDesc = rowStrs.some(s => /(적요|내역|내용|항목)/.test(s));
                    const hasMoney = rowStrs.some(s => /(수입|지출|입금|출금|예금|통장|현금)/.test(s));

                    if ((hasDate && hasMoney) || (hasDesc && hasMoney)) {
                        headerRowIdx = r;
                        const prevRowStrs = r > 0 ? (formattedRows[r - 1] || rows[r - 1] || []).map(v => String(v || '').replace(/\s+/g, '')) : [];
                        const nextRowStrs = (formattedRows[r + 1] || rows[r + 1] || []).map(v => String(v || '').replace(/\s+/g, ''));
                        const isTwoRowHeader = nextRowStrs.some(s => /^(수입|지출|입금|출금|잔액|차감잔액|년|월|일)$/.test(s));
                        dataStartRow = isTwoRowHeader ? r + 2 : r + 1;

                        // 상위 행(r-1) 및 현재 행(r)에서 통장(예금) vs 현금 섹션 추적
                        let prevSection = '';
                        let topSection = '';
                        const maxCols = Math.max(prevRowStrs.length, rowStrs.length, nextRowStrs.length);
                        for (let c = 0; c < maxCols; c++) {
                            const prev = prevRowStrs[c] || '';
                            const top = rowStrs[c] || '';
                            const sub = isTwoRowHeader ? (nextRowStrs[c] || '') : '';
                            const combined = `${top} ${sub}`.trim();

                            if (/(예금|통장|계좌|카드)/.test(prev)) prevSection = 'bank';
                            else if (/현금/.test(prev)) prevSection = 'cash';
                            else if (/(합계|총계|비고|확인|서명)/.test(prev)) prevSection = 'other';

                            if (/(예금|통장|계좌|카드)/.test(top)) topSection = 'bank';
                            else if (/현금/.test(top)) topSection = 'cash';
                            else if (/(합계|총계|비고|확인|서명)/.test(top)) topSection = 'other';

                            const activeSection = topSection || prevSection;
                            const colSection = /(예금|통장|계좌|카드)/.test(combined)
                                ? 'bank'
                                : (/현금/.test(combined) ? 'cash' : (activeSection === 'bank' || activeSection === 'cash' ? activeSection : ''));

                            const isDateCol = /^(일자|날짜|거래일|거래일자|년월일|월\/?일)$/.test(top) || /^(일자|날짜)$/.test(sub);
                            const isYearCol = top === '년' || sub === '년';
                            const isMonthCol = top === '월' || sub === '월';
                            const isDayCol = top === '일' || sub === '일';
                            const isDescCol = /(적요|내역|내용|항목)/.test(combined);

                            // 공통 열 매핑
                            if (colMap.yearCol === -1 && isYearCol) colMap.yearCol = c;
                            if (colMap.monthCol === -1 && isMonthCol) colMap.monthCol = c;
                            if (colMap.dayCol === -1 && isDayCol) colMap.dayCol = c;
                            if (colMap.date === -1 && isDateCol) colMap.date = c;
                            if (colMap.desc === -1 && isDescCol) colMap.desc = c;
                            if (colMap.method === -1 && /^(수단|결제수단|구분|계정)$/.test(top)) colMap.method = c;

                            // 통장/현금 좌우 분할 테이블용 개별 날짜·내역 열 매핑
                            if (colSection === 'bank') {
                                if (colMap.bankDate === -1 && isDateCol) colMap.bankDate = c;
                                if (colMap.bankMonthCol === -1 && isMonthCol) colMap.bankMonthCol = c;
                                if (colMap.bankDayCol === -1 && isDayCol) colMap.bankDayCol = c;
                                if (colMap.bankDesc === -1 && isDescCol) colMap.bankDesc = c;
                            } else if (colSection === 'cash') {
                                if (colMap.cashDate === -1 && isDateCol) colMap.cashDate = c;
                                if (colMap.cashMonthCol === -1 && isMonthCol) colMap.cashMonthCol = c;
                                if (colMap.cashDayCol === -1 && isDayCol) colMap.cashDayCol = c;
                                if (colMap.cashDesc === -1 && isDescCol) colMap.cashDesc = c;
                            }

                            const isInc = /(수입|입금)/.test(sub || top);
                            const isExp = /(지출|출금)/.test(sub || top);
                            const isBal = /잔액/.test(sub || top);

                            if (colSection === 'bank') {
                                if (isInc && colMap.bankIncome === -1) colMap.bankIncome = c;
                                else if (isExp && colMap.bankExpense === -1) colMap.bankExpense = c;
                                else if (isBal && colMap.bankBalance === -1) colMap.bankBalance = c;
                            } else if (colSection === 'cash') {
                                if (isInc && colMap.cashIncome === -1) colMap.cashIncome = c;
                                else if (isExp && colMap.cashExpense === -1) colMap.cashExpense = c;
                                else if (isBal && colMap.cashBalance === -1) colMap.cashBalance = c;
                            } else if (activeSection !== 'other') {
                                if (isInc && colMap.genericIncome === -1) colMap.genericIncome = c;
                                else if (isExp && colMap.genericExpense === -1) colMap.genericExpense = c;
                                else if (isBal && colMap.genericBalance === -1) colMap.genericBalance = c;
                            }
                        }

                        // '월'과 '일' 열이 분리된 양식이면 분리 열을 우선 사용
                        if (colMap.monthCol >= 0 && colMap.dayCol >= 0) colMap.date = -1;
                        if (colMap.bankMonthCol >= 0 && colMap.bankDayCol >= 0) colMap.bankDate = -1;
                        if (colMap.cashMonthCol >= 0 && colMap.cashDayCol >= 0) colMap.cashDate = -1;
                        break;
                    }
                }

                if (headerRowIdx === -1 || dataStartRow === -1) return;

                const defaultSheetMethod = /현금/.test(sheetName) && !/(예금|통장)/.test(sheetName) ? 'cash' : 'bank';
                let lastSharedMonth = sheetMonth;
                let lastBankMonth = sheetMonth;
                let lastCashMonth = sheetMonth;
                const defaultDate = sheetMonth ? `${sheetYear}-${String(sheetMonth).padStart(2, '0')}-01` : `${sheetYear}-01-01`;
                let lastSharedDate = defaultDate;
                let lastBankDate = defaultDate;
                let lastCashDate = defaultDate;

                const extractRowDate = (row, fRow, dateCol, mCol, dCol, curMonth) => {
                    let nextMonth = curMonth;
                    let dateStr = null;

                    if (mCol >= 0 && dCol >= 0) {
                        const fullFromMonth = parseExcelDate(row[mCol], sheetYear, null, is1904);
                        if (fullFromMonth && String(row[dCol] || '').trim() === '') {
                            dateStr = fullFromMonth;
                        } else {
                            let yVal = sheetYear;
                            if (colMap.yearCol >= 0) {
                                const yDigits = String(row[colMap.yearCol] || '').replace(/[^0-9]/g, '');
                                if (yDigits.length === 4) yVal = parseInt(yDigits, 10);
                                else if (yDigits.length === 2) yVal = 2000 + parseInt(yDigits, 10);
                            }
                            const mDigits = String(fRow[mCol] || row[mCol] || '').replace(/[^0-9]/g, '');
                            const dDigits = String(fRow[dCol] || row[dCol] || '').replace(/[^0-9]/g, '');
                            if (mDigits) {
                                const mParsed = parseInt(mDigits, 10);
                                if (mParsed >= 1 && mParsed <= 12) nextMonth = mParsed;
                            }
                            const dVal = dDigits ? parseInt(dDigits, 10) : NaN;
                            if (nextMonth >= 1 && nextMonth <= 12 && dVal >= 1 && dVal <= 31) {
                                dateStr = `${yVal}-${String(nextMonth).padStart(2, '0')}-${String(dVal).padStart(2, '0')}`;
                            }
                        }
                    } else if (dateCol >= 0) {
                        dateStr = parseExcelDate(row[dateCol], sheetYear, nextMonth, is1904);
                        if (!dateStr && fRow[dateCol] !== undefined && fRow[dateCol] !== '') {
                            dateStr = parseExcelDate(fRow[dateCol], sheetYear, nextMonth, is1904);
                        }
                        if (dateStr) {
                            const parsedY = parseInt(dateStr.slice(0, 4), 10);
                            const parsedM = parseInt(dateStr.slice(5, 7), 10);
                            if (parsedY >= 2000 && parsedY <= 2099 && !yearDetectedExplicitly) {
                                sheetYear = parsedY;
                                detectedYear = parsedY;
                            }
                            if (parsedM >= 1 && parsedM <= 12) nextMonth = parsedM;
                        }
                    } else if (dCol >= 0 && nextMonth) {
                        const dDigits = String(fRow[dCol] || row[dCol] || '').replace(/[^0-9]/g, '');
                        const dVal = dDigits ? parseInt(dDigits, 10) : NaN;
                        if (dVal >= 1 && dVal <= 31) {
                            dateStr = `${sheetYear}-${String(nextMonth).padStart(2, '0')}-${String(dVal).padStart(2, '0')}`;
                        }
                    }

                    return { dateStr, nextMonth };
                };

                const isSummaryText = (cleanStr) => Boolean(
                    cleanStr && summaryKeywords.some(k =>
                        cleanStr === k || cleanStr.endsWith('합계') || cleanStr.endsWith('월계') || cleanStr.endsWith('누계') || cleanStr.endsWith('소계')
                    )
                );

                for (let r = dataStartRow; r < rows.length; r++) {
                    const row = rows[r] || [];
                    const fRow = formattedRows[r] || [];

                    // 공통 날짜·내역 추출
                    const sharedDescRaw = colMap.desc >= 0 ? String(fRow[colMap.desc] || row[colMap.desc] || '').trim() : '';
                    const sharedRes = extractRowDate(row, fRow, colMap.date, colMap.monthCol, colMap.dayCol, lastSharedMonth);
                    lastSharedMonth = sharedRes.nextMonth;
                    if (sharedRes.dateStr) lastSharedDate = sharedRes.dateStr;

                    const hasSplitBankCash = colMap.bankIncome >= 0 || colMap.bankExpense >= 0 || colMap.cashIncome >= 0 || colMap.cashExpense >= 0;

                    if (hasSplitBankCash) {
                        // 통장 전용 날짜·내역 (없으면 공통 값 사용)
                        const hasOwnBankDate = colMap.bankDate >= 0 || (colMap.bankMonthCol >= 0 && colMap.bankDayCol >= 0);
                        const bankDateRes = hasOwnBankDate
                            ? extractRowDate(row, fRow, colMap.bankDate, colMap.bankMonthCol, colMap.bankDayCol, lastBankMonth)
                            : { dateStr: sharedRes.dateStr, nextMonth: lastSharedMonth };
                        lastBankMonth = bankDateRes.nextMonth;
                        if (bankDateRes.dateStr) lastBankDate = bankDateRes.dateStr;

                        const bankDescRaw = colMap.bankDesc >= 0
                            ? String(fRow[colMap.bankDesc] || row[colMap.bankDesc] || '').trim()
                            : sharedDescRaw;
                        const bankDescClean = bankDescRaw.replace(/\s+/g, '');

                        // 현금 전용 날짜·내역 (없으면 공통 값 사용)
                        const hasOwnCashDate = colMap.cashDate >= 0 || (colMap.cashMonthCol >= 0 && colMap.cashDayCol >= 0);
                        const cashDateRes = hasOwnCashDate
                            ? extractRowDate(row, fRow, colMap.cashDate, colMap.cashMonthCol, colMap.cashDayCol, lastCashMonth)
                            : { dateStr: sharedRes.dateStr, nextMonth: lastSharedMonth };
                        lastCashMonth = cashDateRes.nextMonth;
                        if (cashDateRes.dateStr) lastCashDate = cashDateRes.dateStr;

                        const cashDescRaw = colMap.cashDesc >= 0
                            ? String(fRow[colMap.cashDesc] || row[colMap.cashDesc] || '').trim()
                            : sharedDescRaw;
                        const cashDescClean = cashDescRaw.replace(/\s+/g, '');

                        // 이월 행 감지 (통장·현금 각각 독립적으로 최초 이월 잔액 보관)
                        if (bankDescClean.includes('이월') || cashDescClean.includes('이월')) {
                            const bBal = colMap.bankBalance >= 0 ? parseExcelAmount(row[colMap.bankBalance]) : 0;
                            const cBal = colMap.cashBalance >= 0 ? parseExcelAmount(row[colMap.cashBalance]) : 0;
                            if (!initialCarryOver) {
                                if (bBal !== 0 || cBal !== 0) {
                                    initialCarryOver = {
                                        date: bankDateRes.dateStr || cashDateRes.dateStr || lastSharedDate,
                                        bank: bankDescClean.includes('이월') ? bBal : 0,
                                        cash: cashDescClean.includes('이월') ? cBal : 0
                                    };
                                }
                            } else {
                                if (bankDescClean.includes('이월') && initialCarryOver.bank === 0 && bBal !== 0) {
                                    initialCarryOver.bank = bBal;
                                }
                                if (cashDescClean.includes('이월') && initialCarryOver.cash === 0 && cBal !== 0) {
                                    initialCarryOver.cash = cBal;
                                }
                            }
                        }

                        // 통장 거래 추출
                        if (!bankDescClean.includes('이월') && !isSummaryText(bankDescClean)) {
                            const bInc = colMap.bankIncome >= 0 ? parseExcelAmount(row[colMap.bankIncome]) : 0;
                            const bExp = colMap.bankExpense >= 0 ? parseExcelAmount(row[colMap.bankExpense]) : 0;
                            const finalBankDate = bankDateRes.dateStr || lastBankDate;
                            const finalBankDesc = bankDescRaw || '내역 없음';
                            if (bInc > 0) parsedItems.push({ date: finalBankDate, type: 'income', method: 'bank', description: finalBankDesc, amount: bInc });
                            if (bExp > 0) parsedItems.push({ date: finalBankDate, type: 'expense', method: 'bank', description: finalBankDesc, amount: bExp });
                        }

                        // 현금 거래 추출
                        if (!cashDescClean.includes('이월') && !isSummaryText(cashDescClean)) {
                            const cInc = colMap.cashIncome >= 0 ? parseExcelAmount(row[colMap.cashIncome]) : 0;
                            const cExp = colMap.cashExpense >= 0 ? parseExcelAmount(row[colMap.cashExpense]) : 0;
                            const finalCashDate = cashDateRes.dateStr || lastCashDate;
                            const finalCashDesc = cashDescRaw || '내역 없음';
                            if (cInc > 0) parsedItems.push({ date: finalCashDate, type: 'income', method: 'cash', description: finalCashDesc, amount: cInc });
                            if (cExp > 0) parsedItems.push({ date: finalCashDate, type: 'expense', method: 'cash', description: finalCashDesc, amount: cExp });
                        }
                    } else if (colMap.genericIncome >= 0 || colMap.genericExpense >= 0) {
                        const descClean = sharedDescRaw.replace(/\s+/g, '');
                        if (isSummaryText(descClean)) continue;

                        if (descClean.includes('이월')) {
                            const gBal = colMap.genericBalance >= 0 ? parseExcelAmount(row[colMap.genericBalance]) : 0;
                            if (gBal !== 0) {
                                if (!initialCarryOver) {
                                    initialCarryOver = {
                                        date: sharedRes.dateStr || lastSharedDate,
                                        bank: defaultSheetMethod === 'bank' ? gBal : 0,
                                        cash: defaultSheetMethod === 'cash' ? gBal : 0
                                    };
                                } else {
                                    if (defaultSheetMethod === 'bank' && initialCarryOver.bank === 0) initialCarryOver.bank = gBal;
                                    if (defaultSheetMethod === 'cash' && initialCarryOver.cash === 0) initialCarryOver.cash = gBal;
                                }
                            }
                            continue;
                        }

                        const inc = colMap.genericIncome >= 0 ? parseExcelAmount(row[colMap.genericIncome]) : 0;
                        const exp = colMap.genericExpense >= 0 ? parseExcelAmount(row[colMap.genericExpense]) : 0;
                        if (!inc && !exp) continue;

                        const methodText = colMap.method >= 0 ? String(row[colMap.method] || '') : '';
                        const rowMethod = /현금/.test(methodText)
                            ? 'cash'
                            : (/(통장|예금|카드|계좌)/.test(methodText) ? 'bank' : defaultSheetMethod);

                        const finalDesc = sharedDescRaw || '내역 없음';
                        const finalDate = sharedRes.dateStr || lastSharedDate;

                        if (inc > 0) parsedItems.push({ date: finalDate, type: 'income', method: rowMethod, description: finalDesc, amount: inc });
                        if (exp > 0) parsedItems.push({ date: finalDate, type: 'expense', method: rowMethod, description: finalDesc, amount: exp });
                    }
                }
            });

            if (!detectedUserName && baseFileName && !/^(금전출납부|출납부|동광복지재단)/.test(baseFileName)) {
                detectedUserName = baseFileName;
            }

            return {
                fileName,
                sheetCount: workbook.SheetNames.length,
                detectedUserName,
                detectedGroup,
                detectedYear,
                items: parsedItems,
                initialCarryOver
            };
        };

        // --- INLINE SVG ICONS (외부 아이콘 CDN 오류 방지) ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {

            Receipt: (props) => <IconBase {...props}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="16" y1="8" x2="8" y2="8"/><line x1="16" y1="12" x2="8" y2="12"/><line x1="16" y1="16" x2="8" y2="16"/></IconBase>,
            Printer: (props) => <IconBase {...props}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></IconBase>,
            Users: (props) => <IconBase {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,

            Trash2: (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>,
            Eye: (props) => <IconBase {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            Edit2: (props) => <IconBase {...props}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>,
            AlertCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>,
            Download: (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>,
            Upload: (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconBase>,
            Maximize: (props) => <IconBase {...props}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></IconBase>,
            Power: (props) => <IconBase {...props}><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></IconBase>,
            CreditCard: (props) => <IconBase {...props}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></IconBase>,
            Banknote: (props) => <IconBase {...props}><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></IconBase>,
            Cloud: (props) => <IconBase {...props}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></IconBase>,
            FileSpreadsheet: (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></IconBase>,
        };

        const {
            UserPlus, Wallet, Receipt, Printer, Users, Check, X,
            Calendar, Trash2, Eye, Edit2, AlertCircle,
            Download, Upload, Maximize, Power, CreditCard, Banknote, Cloud, FileSpreadsheet
        } = Icons;

        // --- UI COMPONENTS ---

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, title = '', type = 'button' }) => {
            const baseStyle = "px-4 py-2 rounded-lg font-medium transition-colors duration-200 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 disabled:bg-blue-300",
                secondary: "bg-gray-100 text-gray-700 hover:bg-gray-200 disabled:bg-gray-50",
                danger: "bg-red-100 text-red-600 hover:bg-red-200",
                outline: "border border-gray-300 text-gray-700 hover:bg-gray-50",
                icon: "p-2 rounded-full hover:bg-gray-100 text-gray-600 transition-colors"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} title={title} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Card = ({ title, children, className = '' }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-6 ${className}`}>
                {title && <h2 className="text-xl font-bold text-gray-800 mb-4">{title}</h2>}
                {children}
            </div>
        );

        const Input = ({ label, type = "text", value, onChange, placeholder, min, max, lang = "ko", style = { imeMode: 'active' } }) => (
            <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                <input
                    type={type}
                    value={value}
                    onChange={onChange}
                    placeholder={placeholder}
                    min={min}
                    max={max}
                    lang={lang}
                    style={style}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                />
            </div>
        );

        const MethodSelector = ({ value, onChange, bankLabel = '통장' }) => (
            <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-1">결제 수단</label>
                <div className="flex gap-2">
                    <button
                        type="button"
                        onClick={() => onChange('bank')}
                        className={`flex-1 py-2 rounded-lg border flex items-center justify-center gap-2 font-medium transition-colors ${
                            value === 'bank'
                                ? 'bg-blue-600 text-white border-blue-600'

                        <CreditCard size={18} /> {bankLabel}

                    <button
                        type="button"

                        className={`flex-1 py-2 rounded-lg border flex items-center justify-center gap-2 font-medium transition-colors ${

                                ? 'bg-yellow-500 text-white border-yellow-500'
                                : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'

                        <Banknote size={18} /> 현금

        // --- PRINT DOCUMENT (MULTI-PAGE LAYOUT, NO BLANK PAGES) ---
        const PrintableDocument = ({ selectedYear, monthlyLedgers, filterUser, targetName, formatCurrency }) => {
            // 한 장에 거래내역 22개 표시 (1페이지는 전월 이월 1행 + 거래내역 22개 = 23행, 다음 페이지부터 거래내역 22개)
            const ROWS_PER_FIRST_PAGE = 23;
            const ROWS_PER_NEXT_PAGE = 22;

            // 체크된 각 월마다 별도의 월별 출납부 페이지 생성 (월별 1일 전월 이월 포함)
            const allPages = [];

            monthlyLedgers.forEach((ledger) => {
                const buildRows = (txList, initialBalance) => {
                    let currentBalance = initialBalance;
                    const rows = [{
                        id: `carry-${ledger.ym}`,
                        isCarryOver: true,
                        date: `${ledger.ym}-01`,
                        description: '전월 이월',
                        displayIncome: 0,
                        displayExpense: 0,
                        balance: currentBalance
                    }];

                    txList.forEach(t => {
                        const amount = filterUser === 'all' ? (t.type === 'income' ? t.amount : t.totalAmount) : t.amount;
                        if (t.type === 'income') {
                            currentBalance += amount;
                            rows.push({ ...t, isCarryOver: false, displayIncome: amount, displayExpense: 0, balance: currentBalance });
                        } else {
                            currentBalance -= amount;
                            rows.push({ ...t, isCarryOver: false, displayIncome: 0, displayExpense: amount, balance: currentBalance });
                        }
                    });
                    return rows;
                };

                const bankTx = ledger.transactions.filter(t => (t.method || 'bank') === 'bank');
                const cashTx = ledger.transactions.filter(t => (t.method || 'bank') === 'cash');

                const bankRowsAll = buildRows(bankTx, ledger.opening.bank);
                const cashRowsAll = buildRows(cashTx, ledger.opening.cash);

                const totalItems = Math.max(bankRowsAll.length, cashRowsAll.length);
                const monthPages = [];

                monthPages.push({
                    ledger,
                    isFirstOfMonth: true,
                    bank: bankRowsAll.slice(0, ROWS_PER_FIRST_PAGE),
                    cash: cashRowsAll.slice(0, ROWS_PER_FIRST_PAGE)
                });

                        cash: cashRowsAll.slice(currentIndex, currentIndex + ROWS_PER_NEXT_PAGE)

        // --- GLOBAL DIALOG (alert / confirm 대체) ---
        const GlobalDialog = ({ config, onClose, onConfirm }) => {
            if (!config.isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 z-[10000] flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 animate-in">
                        <h3 className="text-lg font-bold mb-3 flex items-center gap-2">
                            {config.type === 'alert' && <AlertCircle className="text-blue-600" />}
                            {config.type === 'confirm' && <AlertCircle className="text-orange-600" />}
