<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화누리카드 도서 관리 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f7fdfc;
            color: #1e293b;
        }

        /* 인쇄 최적화 스타일 (A4 세로, 상 20mm / 좌우하 10mm) */
        @media print {
            @page { size: A4 portrait; margin: 20mm 10mm 10mm 10mm; } 
            
            html, body, main { 
                overflow: visible !important; 
                height: auto !important; 
                min-height: auto !important;
                max-height: none !important;
                position: static !important;
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            body > *:not(main) { display: none !important; }
            main > *:not(#print-area) { display: none !important; }
            .no-print, nav, header, button, #message-box, .fixed, #exit-screen { display: none !important; }
            
            .print-only { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            
            #print-area {
                position: static !important;
                width: 100% !important;
            }

            .family-section { page-break-after: always; break-after: page; padding: 0 !important; }
            .family-section:last-child { page-break-after: auto; break-after: auto; }
            
            table { width: 100% !important; border-collapse: collapse !important; border: 1.5px solid #000 !important; margin-top: 10px; }
            tr { page-break-inside: avoid; }
            th, td { border: 1px solid #000 !important; padding: 6px 8px !important; text-align: center !important; font-size: 10.5pt !important; color: #000 !important; height: 32px; }
            th { background-color: #f0f0f0 !important; font-weight: 800 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            h1 { font-size: 20pt !important; text-align: center; font-weight: 900 !important; text-decoration: underline; text-underline-offset: 8px; margin-bottom: 15px !important; color: #000 !important; }
            .print-header-info { display: flex !important; justify-content: space-between !important; align-items: center !important; margin-bottom: 8px; font-weight: bold; border-bottom: 1.5px solid #000; padding-bottom: 4px; font-size: 13pt; color: #000 !important; }
        }

        .print-only { display: none; }
        @media print { .print-only { display: block !important; } }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f0fdfa; }
        ::-webkit-scrollbar-thumb { background: #99f6e4; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #5eead4; }
        .active-tab { background-color: #10b981; color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.15); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden md:overflow-hidden text-slate-800 text-sm">

    <!-- 사이드바 내비게이션 -->
    <nav id="sidebar-nav" class="w-full md:w-64 bg-emerald-50 border-b md:border-b-0 md:border-r border-emerald-100 p-5 md:p-6 space-y-6 md:space-y-8 flex-shrink-0 no-print flex flex-col md:h-screen overflow-y-auto">
        <div class="flex items-center justify-between md:justify-start md:space-x-3">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.setActiveTab('dashboard')">
                <div class="bg-emerald-500 p-2 rounded-xl text-white shadow-sm">
                    <i data-lucide="book-open" size="24"></i>
                </div>
                <h1 class="text-xl font-black leading-tight text-emerald-900">문화누리<br/>관리시스템</h1>
            </div>
        </div>

        <!-- 구글 시트 자동 동기화 상태 배지 -->
        <div id="sync-status-card" class="bg-white/90 border border-emerald-100 rounded-2xl p-3.5 shadow-sm space-y-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 min-w-0">
                    <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 flex-shrink-0"></span>
                    <span id="sync-label" class="text-[11px] font-black text-emerald-900 truncate">구글 시트 연동 준비</span>
                </div>
                <button onclick="window.saveToGoogleSheet({ manual: true })" title="지금 수동 저장" class="p-1.5 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white transition-colors">
                    <i data-lucide="cloud-upload" size="13"></i>
                </button>
            </div>
            <div class="flex items-center justify-between text-[10px] text-slate-400 font-bold">
                <span>대상 시트: <strong class="text-emerald-600">book</strong></span>
                <span id="sync-time" class="font-mono">--:--:--</span>
            </div>
        </div>

        <!-- 탭 메뉴 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-1 gap-1.5 flex-1" id="nav-tabs"></div>

        <!-- 종료 버튼 -->
        <div class="pt-4 md:pt-6 border-t border-emerald-100 space-y-2">
            <button onclick="window.handleExitApp()" class="w-full flex items-center justify-center md:justify-start space-x-3 px-4 py-3 rounded-xl bg-white text-rose-500 border border-rose-100 hover:bg-rose-500 hover:text-white transition-all shadow-sm font-bold text-sm">
                <i data-lucide="power" size="18"></i>
                <span>구글 시트 저장 후 종료</span>
            </button>
        </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <main id="main-frame" class="flex-1 p-4 md:p-8 overflow-y-auto md:max-h-screen relative text-slate-800 text-sm">
        <div id="print-area" class="print-only text-slate-900"></div>
        <header id="main-header" class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4 no-print"></header>
        <div id="content-area" class="no-print pb-12"></div>
    </main>

    <!-- 종료 진행 및 완료 오버레이 화면 -->
    <div id="exit-screen" class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[300] hidden flex flex-col items-center justify-center text-white text-center p-6">
        <div id="exit-saving-state" class="max-w-md w-full p-8 rounded-[2.5rem] bg-slate-800/80 border border-slate-700 shadow-2xl">
            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse">
                <i data-lucide="cloud-upload" size="40"></i>
            </div>
            <h2 class="text-2xl font-black mb-2">구글 시트(book) 저장 중...</h2>
            <p class="text-slate-400 text-sm">최종 데이터를 안전하게 저장한 뒤 시스템을 종료합니다.</p>
        </div>
        <div id="exit-done-state" class="hidden max-w-md w-full p-8 rounded-[2.5rem] bg-slate-800/90 border border-slate-700 shadow-2xl">
            <div class="w-20 h-20 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-emerald-500/30">
                <i data-lucide="check" size="40"></i>
            </div>
            <h2 class="text-3xl font-black mb-2">시스템 종료됨</h2>
            <p id="exit-done-desc" class="text-slate-300 text-sm leading-relaxed mb-6">
                구글 시트(<strong>book</strong>)에 최종 데이터 저장이 완료되었습니다.<br/>브라우저 탭을 닫으셔도 좋습니다.
            </p>
            <div class="flex flex-col sm:flex-row gap-2 justify-center">
                <button onclick="window.handleExportBackup()" class="px-5 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="download" size="14"></i> JSON 백업 추가 저장
                </button>
                <button onclick="window.handleReopenApp()" class="px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="rotate-ccw" size="14"></i> 시스템 다시 열기
                </button>
            </div>
        </div>
    </div>

    <!-- 이용자 상세 보기 슬라이드 모달 -->
    <div id="modal-container" class="fixed inset-0 bg-emerald-950/20 backdrop-blur-md z-50 hidden no-print flex justify-end" onclick="if(event.target === this) window.closeModal()">
        <div id="modal-content" class="w-full max-w-lg bg-white h-full shadow-2xl p-6 md:p-8 flex flex-col transform translate-x-full transition-transform duration-300"></div>
    </div>

    <!-- 커스텀 확인(Confirm) 모달 (alert/confirm 대체) -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] hidden no-print flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] max-w-sm w-full p-6 md:p-7 shadow-2xl border border-emerald-100">
            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4">
                <i data-lucide="help-circle" size="24"></i>
            </div>
            <h3 id="confirm-modal-title" class="text-lg font-black text-slate-900 mb-2">확인</h3>
            <p id="confirm-modal-message" class="text-sm text-slate-600 font-medium leading-relaxed mb-6 whitespace-pre-line"></p>
            <div class="flex gap-2">
                <button id="confirm-cancel-btn" onclick="window.closeConfirmModal(false)" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm hover:bg-slate-200 transition-colors">취소</button>
                <button id="confirm-ok-btn" onclick="window.closeConfirmModal(true)" class="flex-1 py-3 rounded-xl bg-emerald-500 text-white font-black text-sm hover:bg-emerald-600 transition-colors shadow-md">확인</button>
            </div>
        </div>
    </div>

    <!-- 구글 Apps Script 연결 정보 / 가이드 모달 -->
    <div id="gas-info-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] hidden no-print flex items-center justify-center p-4" onclick="if(event.target === this) window.closeGasInfoModal()">
        <div class="bg-white rounded-[2rem] max-w-2xl w-full p-6 md:p-8 shadow-2xl border border-emerald-100 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black text-emerald-950 flex items-center gap-2">
                    <i data-lucide="sheet" class="text-emerald-500" size="20"></i> 구글 시트(book) 연동 정보
                </h3>
                <button onclick="window.closeGasInfoModal()" class="p-2 rounded-xl bg-slate-100 text-slate-500 hover:bg-slate-200">
                    <i data-lucide="x" size="18"></i>
                </button>
            </div>
            <div class="space-y-4 text-xs">
                <div class="bg-emerald-50/70 p-4 rounded-2xl border border-emerald-100 space-y-1.5">
                    <p class="font-black text-emerald-900">연결된 Apps Script 웹 앱 주소</p>
                    <p class="font-mono text-[11px] text-emerald-700 break-all bg-white p-2.5 rounded-xl border border-emerald-100" id="gas-url-display"></p>
                    <p class="text-slate-500 font-medium pt-1">저장 시트명: <strong class="text-emerald-700">book</strong> (데이터 변경 시 및 프로그램 종료 시 자동 전송)</p>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-black text-slate-700">참고용 Google Apps Script (doGet / doPost) 코드</span>
                        <button onclick="window.copyGasSampleCode()" class="px-3 py-1.5 bg-emerald-500 text-white rounded-lg font-bold hover:bg-emerald-600 transition-colors flex items-center gap-1">
                            <i data-lucide="copy" size="12"></i> 코드 복사
                        </button>
                    </div>
                    <pre id="gas-sample-code" class="bg-slate-900 text-emerald-200 p-4 rounded-2xl overflow-x-auto text-[11px] font-mono leading-relaxed"></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- 상단 토스트 알림 메시지 -->
    <div id="message-box" class="fixed top-6 left-1/2 -translate-x-1/2 z-[250] px-5 py-3 bg-slate-800 text-white rounded-2xl shadow-2xl hidden flex items-center gap-3 max-w-[90vw]">
        <i id="message-icon" data-lucide="info" size="18" class="text-emerald-400 flex-shrink-0"></i>
        <span id="message-text" class="font-bold text-xs md:text-sm"></span>
    </div>

    <script>
        // ==========================================
        // 1. 구글 시트(Google Apps Script) 연동 설정
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmiCv86g7KKlS6NlYapvyfPuduBaRWBT6bj0tTh3Ln2QcmEJ_Sdwz_G-2Q-QkaY_ihow/exec";
        const GOOGLE_SHEET_NAME = "book";
        const LOCAL_STORAGE_KEY = "cultureNuriManagerData_book_v2";

        // 자동 저장 디바운스 타이머 및 상태
        let autoSaveTimer = null;
        let isSavingToSheet = false;
        let lastSyncTime = "--:--:--";
        let messageTimer = null;
        let confirmCallback = null;

        // ==========================================
        // 2. 애플리케이션 데이터 상태
        // ==========================================
        const DEFAULT_USERS = [
            { id: 1, family: '바위솔', name: '김영남', budget: 150000, spent: [0, 0, 0, 0], interests: ['필사북', '국가'], receivedStatus: [false, false, false, false] },
            { id: 2, family: '기린초', name: '박효균', budget: 150000, spent: [0, 0, 0, 0], interests: ['색칠북'], receivedStatus: [false, false, false, false] },
            { id: 3, family: '붓꽃', name: '유인수', budget: 150000, spent: [0, 0, 0, 0], interests: ['색칠북', '컬러링북'], receivedStatus: [false, false, false, false] },
        ];

        // applicants 구조: { name: string, round: number, actualPrice?: number }[]
        const DEFAULT_BOOKS = [
            { id: 1, title: '우리 아이 처음 만나는 첫 스티커 색칠북 7권세트', price: 37800, author: 'oh!북스', date: '2023-07-01', category: '색칠북', applicants: [] },
            { id: 2, title: '바오밥 성장그림북 1~3', price: 35000, author: '바오밥', date: '2020-01-01', category: '교재', applicants: [] },
            { id: 3, title: '어린이 성경 말씀 요점만 따라 쓰기', price: 14000, author: '꿈그린', date: '2025-11-01', category: '필사북', applicants: [] },
        ];

        let usersList = JSON.parse(JSON.stringify(DEFAULT_USERS));
        let booksList = JSON.parse(JSON.stringify(DEFAULT_BOOKS));

        const CATEGORIES = ['색칠북', '컬러링북', '필사북', '교재', '국가'];
        let activeTab = 'dashboard';
        let searchTerm = '';
        let bookSortCriteria = 'date';

        // 대상자/도서 수정 폼 상태
        let editingUserId = null;
        let editingBookId = null;
        let tempUserData = { family: '', name: '', budget: 150000, interests: [] };
        let tempBookData = { title: '', price: '', author: '', date: '', category: '색칠북' };

        // 스마트 구입 신청 상태
        let purchaseUser = "";
        let purchaseRound = 0; // 0~3 (1차~4차)
        let cart = []; // { userName, round, book }[]

        // 구입 확정(입고) 상태
        let receivingUser = "";
        let receivingRound = 0; // 0~3 (1차~4차)
        let receivingItems = []; // { bookId, title, category, author, originalPrice, actualPrice }[]
        let receivingSearch = "";

        // ==========================================
        // 3. 초기화 및 구글 시트 자동 불러오기/저장 엔진
        // ==========================================
        window.onload = async () => {
            // 1) 로컬 캐시 먼저 복원하여 즉각 렌더링
            window.loadFromLocalCache();
            lucide.createIcons();
            window.renderNav();
            window.renderHeader();
            window.updateTabContent();

            // 2) 구글 시트(book)에서 최신 데이터 비동기 불러오기
            await window.loadFromGoogleSheet({ silent: false });
        };

        // 브라우저 탭을 직접 닫을 때도 book 시트로 비콘 전송 시도
        window.addEventListener('beforeunload', () => {
            try {
                const payload = window.buildSheetPayload();
                const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain;charset=utf-8' });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(GOOGLE_SCRIPT_URL, blob);
                }
            } catch (err) {
                console.error('beforeunload beacon error:', err);
            }
        });

        /**
         * 구글 시트(book) 전송용 표준 페이로드 생성
         */
        window.buildSheetPayload = function() {
            return {
                action: 'save',
                sheetName: GOOGLE_SHEET_NAME,
                sheet: GOOGLE_SHEET_NAME,
                timestamp: new Date().toISOString(),
                users: usersList,
                books: booksList,
                // 시트 행 단위 저장 스크립트와도 호환되도록 평탄화 요약 포함
                bookRows: booksList.map(b => ({
                    id: b.id,
                    title: b.title,
                    price: b.price,
                    author: b.author || '',
                    date: b.date || '',
                    category: b.category || '',
                    applicants: JSON.stringify(b.applicants || [])
                }))
            };
        };

        /**
         * 로컬 스토리지 캐시 저장/복원 (오프라인 대비)
         */
        window.saveToLocalCache = function() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
                    users: usersList,
                    books: booksList,
                    savedAt: new Date().toISOString()
                }));
            } catch (e) {
                console.warn('로컬 캐시 저장 실패:', e);
            }
        };

        window.loadFromLocalCache = function() {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.users) && Array.isArray(parsed.books)) {
                    usersList = window.normalizeUsers(parsed.users);
                    booksList = window.normalizeBooks(parsed.books);
                }
            } catch (e) {
                console.warn('로컬 캐시 복원 실패:', e);
            }
        };

        /**
         * 데이터 구조 정규화 (누락 필드 보정)
         */
        window.normalizeUsers = function(list) {
            return (list || []).map((u, idx) => ({
                id: u.id ?? (Date.now() + idx),
                family: u.family || '',
                name: u.name || '',
                budget: Number(u.budget) || 150000,
                spent: Array.isArray(u.spent) && u.spent.length === 4 ? u.spent.map(v => Number(v) || 0) : [0, 0, 0, 0],
                interests: Array.isArray(u.interests) ? u.interests : [],
                receivedStatus: Array.isArray(u.receivedStatus) && u.receivedStatus.length === 4 ? u.receivedStatus : [false, false, false, false]
            }));
        };

        window.normalizeBooks = function(list) {
            return (list || []).map((b, idx) => ({
                id: b.id ?? (Date.now() + idx),
                title: b.title || '',
                price: Number(b.price) || 0,
                author: b.author || '',
                date: b.date || '',
                category: b.category || '교재',
                applicants: Array.isArray(b.applicants) ? b.applicants : []
            }));
        };

        /**
         * 동기화 상태 UI 갱신
         */
        window.updateSyncStatusUI = function(state, text) {
            const dot = document.getElementById('sync-dot');
            const label = document.getElementById('sync-label');
            const timeEl = document.getElementById('sync-time');
            if (!dot || !label) return;

            dot.className = 'w-2.5 h-2.5 rounded-full flex-shrink-0 ';
            if (state === 'saving' || state === 'loading') {
                dot.className += 'bg-amber-400 animate-ping';
            } else if (state === 'synced') {
                dot.className += 'bg-emerald-500';
                lastSyncTime = new Date().toTimeString().slice(0, 8);
            } else if (state === 'error') {
                dot.className += 'bg-rose-500';
            } else {
                dot.className += 'bg-slate-400';
            }

            label.textContent = text;
            if (timeEl) timeEl.textContent = lastSyncTime;
        };

        /**
         * 데이터 변경 시 호출되는 자동 저장 스케줄러 (500ms 디바운스)
         */
        window.triggerAutoSave = function() {
            window.saveToLocalCache();
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            window.updateSyncStatusUI('saving', '구글 시트 저장 대기...');
            autoSaveTimer = setTimeout(() => {
                window.saveToGoogleSheet({ silent: true });
            }, 500);
        };

        /**
         * 구글 시트(book)에 전체 데이터 저장
         */
        window.saveToGoogleSheet = async function(options = {}) {
            const { silent = false, manual = false, isExit = false } = options;
            if (autoSaveTimer) {
                clearTimeout(autoSaveTimer);
                autoSaveTimer = null;
            }

            window.saveToLocalCache();
            isSavingToSheet = true;
            window.updateSyncStatusUI('saving', '시트(book) 저장 중...');

            const payload = window.buildSheetPayload();
            const bodyStr = JSON.stringify(payload);

            try {
                // Google Apps Script CORS preflight 우회를 위해 text/plain 사용
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: bodyStr,
                    redirect: 'follow'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                window.updateSyncStatusUI('synced', '구글 시트(book) 저장됨');
                if (manual) window.showMessage("구글 시트(book)에 데이터를 저장했습니다.");
                isSavingToSheet = false;
                return true;
            } catch (primaryErr) {
                // CORS 헤더 제한으로 응답 읽기만 막힌 경우 no-cors 모드로 재전송하여 저장 보장
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: bodyStr
                    });

                    window.updateSyncStatusUI('synced', '구글 시트(book) 전송됨');
                    if (manual) window.showMessage("구글 시트(book)로 데이터를 전송했습니다.");
                    isSavingToSheet = false;
                    return true;
                } catch (fallbackErr) {
                    console.error('구글 시트 저장 오류:', primaryErr, fallbackErr);
                    window.updateSyncStatusUI('error', '시트 저장 실패 (로컬 보존)');
                    if (!silent || manual || isExit) {
                        window.showMessage("네트워크 오류로 구글 시트 저장에 실패했습니다. (로컬에 임시 저장됨)", "error");
                    }
                    isSavingToSheet = false;
                    return false;
                }
            }
        };

        /**
         * 구글 시트(book)에서 저장된 데이터 불러오기
         */
        window.loadFromGoogleSheet = async function(options = {}) {
            const { silent = false, manual = false } = options;
            window.updateSyncStatusUI('loading', '시트(book) 불러오는 중...');

            try {
                const url = `${GOOGLE_SCRIPT_URL}?action=load&sheetName=${encodeURIComponent(GOOGLE_SHEET_NAME)}&sheet=${encodeURIComponent(GOOGLE_SHEET_NAME)}&_t=${Date.now()}`;
                const response = await fetch(url, { method: 'GET', redirect: 'follow' });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const text = await response.text();
                let parsed = null;
                try {
                    parsed = JSON.parse(text);
                } catch (jsonErr) {
                    throw new Error("JSON 형식이 아닌 응답입니다.");
                }

                // 다양한 Apps Script 응답 구조 유연하게 파싱
                let extractedUsers = null;
                let extractedBooks = null;

                if (parsed && Array.isArray(parsed.users) && Array.isArray(parsed.books)) {
                    extractedUsers = parsed.users;
                    extractedBooks = parsed.books;
                } else if (parsed && parsed.data && Array.isArray(parsed.data.users) && Array.isArray(parsed.data.books)) {
                    extractedUsers = parsed.data.users;
                    extractedBooks = parsed.data.books;
                } else if (parsed && typeof parsed.content === 'string') {
                    const inner = JSON.parse(parsed.content);
                    if (Array.isArray(inner.users) && Array.isArray(inner.books)) {
                        extractedUsers = inner.users;
                        extractedBooks = inner.books;
                    }
                }

                if (extractedUsers && extractedBooks) {
                    if (extractedUsers.length > 0 || extractedBooks.length > 0) {
                        usersList = window.normalizeUsers(extractedUsers);
                        booksList = window.normalizeBooks(extractedBooks);
                        window.saveToLocalCache();
                        if (receivingUser) {
                            window.loadReceivingItems(receivingUser, receivingRound);
                        }
                        window.updateTabContent();
                        window.updateSyncStatusUI('synced', '구글 시트(book) 동기화됨');
                        if (!silent || manual) window.showMessage("구글 시트(book)에서 최신 데이터를 불러왔습니다.");
                    } else {
                        window.updateSyncStatusUI('synced', '시트(book) 연결됨 (초기 상태)');
                        if (manual) window.showMessage("구글 시트(book)에 저장된 데이터가 아직 없습니다.");
                    }
                } else {
                    window.updateSyncStatusUI('synced', '시트(book) 연결됨');
                    if (manual) window.showMessage("구글 시트(book)와 연결되었습니다. 현재 데이터를 저장해 주세요.");
                }
            } catch (err) {
                console.warn('구글 시트 불러오기 건너뜀:', err);
                window.updateSyncStatusUI('synced', '시트(book) 자동저장 대기');
                if (manual) {
                    window.showMessage("시트에서 데이터를 읽지 못했습니다. (Apps Script doGet 설정 확인 필요)", "error");
                }
            }
        };

                                    class="w-full pl-12 pr-4 py-3 bg-white border border-emerald-100 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 font-bold transition-all" value="${window.escapeHtml(searchTerm)}">

        window.handleSearchInput = function(val) {
            searchTerm = val;
            window.updatePurchaseBookList();
        };

        /**
         * 도서별 총 신청 인원수 계산 (기존 확정 인원 + 현재 장바구니 대기 인원 중복 제거 합산)
         */
        window.getTotalBookApplicantCount = function(bookId) {
            const book = booksList.find(b => b.id == bookId);
            const names = new Set();
            if (book && Array.isArray(book.applicants)) {
                book.applicants.forEach(a => names.add(typeof a === 'object' ? a.name : a));
            }
            cart.filter(i => i.book.id == bookId).forEach(i => names.add(i.userName));
            return names.size;
        };

        window.updatePurchaseSidebar = function(users) {
            const sidebar = document.getElementById('p-sidebar-area');
            if (!sidebar) return;
            const cartTotal = cart.reduce((a, b) => a + (Number(b.book.price) || 0), 0);
            const selectedUserObj = users.find(u => u.name === purchaseUser);

            // 선택된 대상자의 기존 구입 내역 (개별 삭제 버튼 포함)
            let historyHtml = '';
            if (purchaseUser && selectedUserObj) {
                const boughtBooks = booksList.filter(b => 
                    (b.applicants || []).some(app => (typeof app === 'object' ? app.name : app) === purchaseUser)
                );

                if (boughtBooks.length > 0) {
                    historyHtml = `
                        <div class="bg-white p-6 rounded-3xl border border-emerald-100 shadow-sm mt-6">
                            <h3 class="font-black mb-4 text-emerald-950 flex items-center gap-2">
                                <i data-lucide="list-checks" size="18" class="text-emerald-500"></i> ${window.escapeHtml(purchaseUser)}님의 기존 구입 내역
                            </h3>
                            <div class="space-y-3 max-h-[300px] overflow-y-auto pr-1 no-scrollbar">
                    `;
                    
                    [1, 2, 3, 4].forEach(r => {
                        const booksInRound = boughtBooks.filter(b => 
                            (b.applicants || []).some(app => 
                                (typeof app === 'object' && app.name === purchaseUser && app.round === r) || 
                                (typeof app !== 'object' && app === purchaseUser && r === 1)
                            )
                        );
                        
                        if (booksInRound.length > 0) {
                            const roundTotal = booksInRound.reduce((sum, b) => {
                                const app = (b.applicants || []).find(a => (typeof a === 'object' ? a.name === purchaseUser && a.round === r : a === purchaseUser && r === 1));
                                const prc = (typeof app === 'object' && app.actualPrice !== undefined) ? Number(app.actualPrice) : (Number(b.price) || 0);
                                return sum + prc;
                            }, 0);
                            historyHtml += `
                                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100">
                                    <div class="flex justify-between items-center mb-2 border-b border-slate-200 pb-1.5">
                                        <span class="text-[11px] font-black text-emerald-700">${r}차 구입</span>
                                        <span class="text-[10px] font-bold text-slate-500 font-mono">${roundTotal.toLocaleString()}원</span>
                                    </div>
                                    <ul class="space-y-1.5">
                                        ${booksInRound.map(b => {
                                            const app = (b.applicants || []).find(a => (typeof a === 'object' ? a.name === purchaseUser && a.round === r : a === purchaseUser && r === 1));
                                            const prc = (typeof app === 'object' && app.actualPrice !== undefined) ? Number(app.actualPrice) : (Number(b.price) || 0);
                                            return `
                                                <li class="text-[11px] text-slate-700 flex justify-between gap-2 items-center">
                                                    <span class="truncate flex-1 font-medium">- ${window.escapeHtml(b.title)}</span>
                                                    <span class="font-bold text-emerald-600 font-mono whitespace-nowrap">${prc.toLocaleString()}</span>
                                                    <button onclick="window.handleCancelPurchase(${b.id}, ${selectedUserObj.id})" class="text-rose-500 hover:text-white bg-rose-50 hover:bg-rose-500 px-2 py-0.5 rounded text-[10px] font-black ml-1 transition-colors">삭제</button>
                                                </li>
                                            `;
                                        }).join('')}
                                    </ul>
                                </div>
                            `;
                        }
                    });
                    historyHtml += `</div></div>`;
                }
            }

            // 일괄 장바구니 (도서별 총 신청 인원수 배지 포함)
            const groupedCart = {};
            cart.forEach(item => {
                if (!groupedCart[item.userName]) groupedCart[item.userName] = [];
                groupedCart[item.userName].push(item);
            });

            let cartHtml = '';
            if (Object.keys(groupedCart).length === 0) {
                cartHtml = '<p class="text-center opacity-60 italic py-4 text-emerald-100">도서를 담아주세요</p>';
            } else {
                for (const [uName, items] of Object.entries(groupedCart)) {
                    const uTotal = items.reduce((sum, i) => sum + (Number(i.book.price) || 0), 0);
                    const uRound = items[0].round + 1;
                    const uObj = usersList.find(u => u.name === uName);
                    const uId = uObj ? uObj.id : '';
                    cartHtml += `
                        <div class="bg-white/20 p-3 rounded-xl border border-white/15 mb-2">
                            <div class="flex justify-between items-center mb-2 border-b border-white/20 pb-1">
                                <span class="font-black text-emerald-50 text-xs">${window.escapeHtml(uName)} (${uRound}차)</span>
                                <span class="font-bold text-white text-xs font-mono">${uTotal.toLocaleString()}원</span>
                            </div>
                            <ul class="space-y-1.5">
                                ${items.map(item => {
                                    const totalAppCount = window.getTotalBookApplicantCount(item.book.id);
                                    return `
                                        <li class="flex justify-between items-center gap-1.5 text-white text-[11px]">
                                            <span class="flex-1 truncate">- ${window.escapeHtml(item.book.title)}</span>
                                            <span class="bg-white/25 text-white px-1.5 py-0.5 rounded-md text-[9px] font-black whitespace-nowrap">총 ${totalAppCount}명</span>
                                            <button onclick="window.handleRemoveFromCart(${uId}, ${item.book.id})" class="text-emerald-100 hover:text-white font-bold text-xs px-1">✕</button>
                                        </li>
                                    `;
                                }).join('')}
                            </ul>
                        </div>
                    `;
                }
            }

            sidebar.innerHTML = `
                <div class="bg-white p-6 rounded-3xl border border-emerald-100 shadow-sm space-y-5">
                    <div>
                        <label class="block text-[11px] font-black text-emerald-800/40 uppercase tracking-widest mb-3">대상자 선택</label>
                        <select onchange="window.handlePurchaseUserSelect(this.value)" class="w-full px-4 py-3 bg-emerald-50/50 border border-emerald-100 rounded-2xl font-black text-emerald-900 outline-none">
                            <option value="">대상자를 선택하세요</option>
                            ${users.map(u => `<option value="${window.escapeHtml(u.name)}" ${purchaseUser === u.name ? 'selected' : ''}>${window.escapeHtml(u.name)} (잔액: ${u.balance.toLocaleString()}원)</option>`).join('')}
                        </select>
                        <div class="grid grid-cols-4 gap-2 mt-4">
                            ${[1, 2, 3, 4].map(r => `<button onclick="window.handleRoundSelect(${r-1})" class="py-2 rounded-xl text-xs font-black border transition-all ${purchaseRound === r-1 ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm' : 'bg-white border-emerald-100 text-emerald-400 hover:bg-emerald-50'}">${r}차</button>`).join('')}
                        </div>
                    </div>
                </div>
                <div class="bg-emerald-500 text-white p-6 md:p-8 rounded-[2.5rem] shadow-2xl shadow-emerald-200 space-y-6">
                    <h3 class="font-black flex items-center gap-2 text-lg"><i data-lucide="shopping-cart"></i> 일괄 장바구니</h3>
                    <div class="space-y-1 max-h-[220px] overflow-y-auto pr-1 no-scrollbar text-xs">
                        ${cartHtml}
                    </div>
                    <div class="pt-6 border-t border-white/20 text-center">
                        <div class="flex justify-between items-center font-black mb-4">
                            <span class="text-[10px] opacity-80 uppercase tracking-widest">총 일괄 합계</span>
                            <span class="text-2xl md:text-3xl font-black font-mono">${cartTotal.toLocaleString()}원</span>
                        </div>
                        <button onclick="window.handleCompletePurchaseAction()" ${cart.length === 0 ? 'disabled' : ''} class="w-full py-4 md:py-5 bg-white text-emerald-600 rounded-3xl font-black text-lg md:text-xl disabled:opacity-30 shadow-xl active:scale-95 transition-all">일괄 구입 확정</button>
                    </div>
                </div>
                ${historyHtml}
            `;
            lucide.createIcons();
        };

        window.updatePurchaseBookList = function() {
            const listArea = document.getElementById('p-book-list-area');
            if (!listArea) return;

            const searchLower = searchTerm.toLowerCase();
            let filtered = [...booksList].filter(book => {
                return book.title.toLowerCase().includes(searchLower) || (book.author && book.author.toLowerCase().includes(searchLower));
            });

            const userObj = usersList.find(u => u.name === purchaseUser);

            filtered.sort((a, b) => {
                const aApps = a.applicants || [];
                const bApps = b.applicants || [];

                const aBought = purchaseUser && aApps.some(app => (typeof app === 'object' ? app.name : app) === purchaseUser) ? 1 : 0;
                const bBought = purchaseUser && bApps.some(app => (typeof app === 'object' ? app.name : app) === purchaseUser) ? 1 : 0;
                if (aBought !== bBought) return aBought - bBought;

                const aPop = aApps.length;
                const bPop = bApps.length;
                if (aPop !== bPop) return bPop - aPop;

                if (userObj) {
                    const aInt = (userObj.interests || []).includes(a.category) ? 1 : 0;
                    const bInt = (userObj.interests || []).includes(b.category) ? 1 : 0;
                    if (aInt !== bInt) return bInt - aInt;
                }

                return (b.date || '0').localeCompare(a.date || '0') || a.title.localeCompare(b.title);
            });

            let recommended = [], regular = [];
            if (userObj) {
                recommended = filtered.filter(b => (userObj.interests || []).includes(b.category));
                regular = filtered.filter(b => !(userObj.interests || []).includes(b.category));
            } else {
                regular = filtered;
            }

            listArea.innerHTML = `
                ${recommended.length > 0 ? `<div class="bg-emerald-50/30 px-5 py-3 font-black text-emerald-600 text-[10px]">관심분야 추천 도서 (인기/최신순)</div>${recommended.map(b => window.getBookItemHtml(b, true)).join('')}` : ''}
                <div class="px-5 py-3 text-[10px] font-black text-slate-400 bg-slate-50 uppercase">전체 도서 목록 (${regular.length}권)</div>
                ${regular.length > 0 ? regular.map(b => window.getBookItemHtml(b, false)).join('') : '<div class="p-10 text-center text-slate-400 font-bold text-xs">검색 결과가 없습니다.</div>'}
            `;
            lucide.createIcons();
        };

        window.getBookItemHtml = function(book, isRec) {
            const inCart = cart.some(i => i.book.id == book.id && i.userName === purchaseUser);
            const safeApplicants = book.applicants || [];
            const boughtBySelf = purchaseUser && safeApplicants.some(app => (typeof app === 'object' ? app.name : app) === purchaseUser);
            const totalPopCount = safeApplicants.length;
            const currentUserObj = usersList.find(u => u.name === purchaseUser);

            const roundGroups = { 1: [], 2: [], 3: [], 4: [] };
            safeApplicants.forEach(app => {
                const name = typeof app === 'object' ? app.name : app;
                const round = typeof app === 'object' ? app.round : 1;
                if (roundGroups[round]) roundGroups[round].push(name);
            });

            const roundInfoHtml = [1, 2, 3, 4].map(r => {
                if (roundGroups[r].length === 0) return '';
                return `<div class="flex items-center gap-1.5 mt-0.5">
                    <span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-black border border-slate-200 text-[9px]">${r}차: ${roundGroups[r].length}명</span>
                    <span class="text-slate-400 font-medium truncate max-w-[260px] text-[9px]">${window.escapeHtml(roundGroups[r].join(', '))}</span>
                </div>`;
            }).join('');

            const actionButton = boughtBySelf && currentUserObj
                ? `<button onclick="window.handleCancelPurchase(${book.id}, ${currentUserObj.id})" class="flex-shrink-0 px-4 py-2.5 rounded-xl text-xs font-black transition-all bg-rose-50 text-rose-500 border border-rose-100 shadow-sm hover:bg-rose-500 hover:text-white ml-3">신청 취소</button>`
                : `<button onclick="window.handleAddToCart(${book.id})" class="flex-shrink-0 px-5 py-2.5 rounded-xl text-xs font-black transition-all ${inCart ? 'bg-slate-100 text-slate-500' : 'bg-emerald-50 text-emerald-600 border border-emerald-100 shadow-sm hover:bg-emerald-500 hover:text-white'} ml-3">
                    ${inCart ? '제외' : '담기'}
                   </button>`;

            return `
                <div class="p-4 flex items-center justify-between hover:bg-emerald-50/5 transition-colors group ${boughtBySelf ? 'bg-slate-50/70' : ''} text-sm">
                    <div class="flex items-center gap-3 md:gap-4 flex-1 min-w-0">
                        <div class="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-xl ${isRec ? 'bg-white border border-emerald-100 shadow-sm text-emerald-500 font-black' : 'bg-slate-50 text-slate-300'}">
                            ${isRec ? totalPopCount : '<i data-lucide="book-open" size="18"></i>'}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <h4 class="font-black text-slate-900 text-sm truncate">${window.escapeHtml(book.title)}</h4>
                                ${totalPopCount >= 3 ? `<span class="bg-rose-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded-full flex-shrink-0 shadow-sm">BEST</span>` : ''}
                            </div>
                            <div class="flex flex-wrap gap-2 items-center mt-1">
                                <span class="text-[8px] px-1.5 py-0.5 rounded-full font-bold border ${window.getCategoryColor(book.category)}">${window.escapeHtml(book.category)}</span>
                                <span class="text-[10px] font-black text-emerald-600 font-mono">${(book.price || 0).toLocaleString()}원</span>
                                <span class="text-[10px] text-slate-400 font-bold">출판사: ${window.escapeHtml(book.author || '미상')} | 출판일: ${window.escapeHtml(book.date || '미상')}</span>
                            </div>
                            <div class="mt-1.5 text-[10px] text-slate-500 font-bold">
                                ${totalPopCount > 0 ? roundInfoHtml : '<span class="text-slate-300 italic font-medium">아직 신청자가 없습니다.</span>'}
                            </div>
                        </div>
                    </div>
                    ${actionButton}
                </div>
            `;
        };

        window.handleCancelPurchase = function(bookId, userId) {
            const userObj = userId ? usersList.find(u => u.id == userId) : usersList.find(u => u.name === purchaseUser);
            if (!userObj) return;
            const targetUser = userObj.name;

            window.showConfirmModal(`'${targetUser}'님의 해당 도서 구입 내역(확정)을 취소하시겠습니까?`, () => {
                const book = booksList.find(b => b.id == bookId);
                if (!book) return;

                const applicantIndex = (book.applicants || []).findIndex(a => (typeof a === 'object' ? a.name : a) === targetUser);
                if (applicantIndex === -1) return;

                const applicantInfo = book.applicants[applicantIndex];
                const roundIndex = (typeof applicantInfo === 'object' ? applicantInfo.round : 1) - 1;
                const deductPrice = (typeof applicantInfo === 'object' && applicantInfo.actualPrice !== undefined)
                    ? Number(applicantInfo.actualPrice)
                    : (Number(book.price) || 0);

                book.applicants.splice(applicantIndex, 1);

                if (userObj.spent && userObj.spent[roundIndex] !== undefined) {
                    userObj.spent[roundIndex] = Math.max(0, userObj.spent[roundIndex] - deductPrice);
                }

                window.triggerAutoSave();
                window.updateTabContent();

                if (activeTab === 'dashboard' && !document.getElementById('modal-container').classList.contains('hidden')) {
                    window.showUserDetail(userObj.id);
                }
                window.showMessage("구입 내역이 취소되었습니다.");
            }, "구입 취소 확인");
        };

                            <div id="receiving-summary-list" class="space-y-2.5 max-h-[240px] overflow-y-auto pr-1 no-scrollbar text-xs">
                                ${window.getReceivingSummaryHtml()}
                            </div>
                            <div class="pt-6 border-t border-white/20 text-center">
                                <div class="flex justify-between items-center font-black mb-4">
                                    <span class="text-[10px] opacity-80 uppercase tracking-widest">최종 반영액</span>
                                    <span id="receiving-total-display" class="text-2xl md:text-3xl font-black font-mono">${totalCalc.toLocaleString()}원</span>
                                </div>
                                <button onclick="window.handleConfirmReceiving()" ${!receivingUser ? 'disabled' : ''} class="w-full py-4 md:py-5 bg-white text-emerald-600 rounded-3xl font-black text-lg md:text-xl disabled:opacity-30 shadow-xl active:scale-95 transition-all">최종 확정 처리</button>
                                <p class="text-[10px] text-emerald-100/80 font-medium mt-3">* 확정 시 변경된 실제 단가가 도서 관리 기준 단가에도 자동 반영됩니다.</p>
                            </div>

                    <div class="lg:col-span-8 space-y-6">
                        <!-- 실제 구입가 수정 영역 (수량 없음) -->

        window.getReceivingSummaryHtml = function() {
            if (receivingItems.length === 0) {
                return '<p class="text-emerald-100/70 text-center py-5 font-bold italic">처리할 내역이 없습니다</p>';
            }
            return receivingItems.map(item => `
                <div class="flex justify-between items-center bg-white/20 p-3 rounded-xl border border-white/15">
                    <span class="flex-1 pr-3 truncate font-bold">${window.escapeHtml(item.title)}</span>
                    <span class="font-black font-mono whitespace-nowrap">${(Number(item.actualPrice) || 0).toLocaleString()}원</span>
                </div>
            `).join('');
        };

        window.getReceivingSearchResults = function() {
            const lower = receivingSearch.toLowerCase().trim();
            if (!lower) {
                return booksList.filter(b => !receivingItems.some(i => i.bookId == b.id)).slice(0, 15);
            }
            return booksList.filter(b =>
                (b.title.toLowerCase().includes(lower) || (b.author && b.author.toLowerCase().includes(lower))) &&
                !receivingItems.some(i => i.bookId == b.id)
            ).slice(0, 25);
        };

        window.getReceivingSearchResultsHtml = function() {
            const results = window.getReceivingSearchResults();
            if (results.length === 0) {
                return '<div class="p-6 text-center text-xs text-slate-400 font-bold">검색 결과가 없습니다.</div>';
            }
            return results.map(book => `
                <div class="p-4 flex items-center justify-between hover:bg-white transition-colors text-sm">
                    <div class="flex-1 pr-4 min-w-0">
                        <h4 class="font-bold text-slate-800 text-xs truncate">${window.escapeHtml(book.title)}</h4>
                        <span class="text-[10px] text-slate-500 font-mono mt-0.5 block">${(book.price || 0).toLocaleString()}원 · ${window.escapeHtml(book.author || '출판사 미상')}</span>
                    </div>
                    <button onclick="window.addReceivingItem(${book.id})" class="flex items-center gap-1 px-3 py-1.5 bg-emerald-50 border border-emerald-100 text-emerald-600 rounded-lg text-[10px] font-black hover:bg-emerald-500 hover:text-white transition-colors flex-shrink-0">
                        <i data-lucide="plus" size="12"></i> 추가
                    </button>
                </div>
            `).join('');
        };

        window.updateReceivingSearchResults = function() {
            const area = document.getElementById('receiving-search-results-area');
            if (area) {
                area.innerHTML = window.getReceivingSearchResultsHtml();
                lucide.createIcons();
            }
        };

        window.loadReceivingItems = function(uName, rIdx) {
            if (!uName) {
                receivingItems = [];
                return;
            }
            receivingItems = booksList
                .filter(b => (b.applicants || []).some(a =>
                    (typeof a === 'object' && a.name === uName && a.round === rIdx + 1) ||
                    (typeof a !== 'object' && a === uName && rIdx === 0)
                ))
                .map(b => {
                    const app = (b.applicants || []).find(a =>
                        (typeof a === 'object' && a.name === uName && a.round === rIdx + 1) ||
                        (typeof a !== 'object' && a === uName && rIdx === 0)
                    );
                    return {
                        bookId: b.id,
                        title: b.title,
                        category: b.category,
                        author: b.author,
                        originalPrice: Number(b.price) || 0,
                        actualPrice: (typeof app === 'object' && app.actualPrice !== undefined) ? Number(app.actualPrice) : (Number(b.price) || 0)
                    };
                });
        };

        window.handleReceivingUserChange = function(name) {
            receivingUser = name;
            window.loadReceivingItems(name, receivingRound);
            window.updateTabContent();
        };

        window.handleReceivingRoundChange = function(r) {
            receivingRound = r;
            window.loadReceivingItems(receivingUser, r);
            window.updateTabContent();
        };

        window.updateReceivingItemPrice = function(bookId, val) {
            const num = Number(val) || 0;
            receivingItems = receivingItems.map(item => item.bookId == bookId ? { ...item, actualPrice: num } : item);
            const totalCalc = receivingItems.reduce((sum, item) => sum + (Number(item.actualPrice) || 0), 0);
            const totalEl = document.getElementById('receiving-total-display');
            const sumListEl = document.getElementById('receiving-summary-list');
            if (totalEl) totalEl.textContent = `${totalCalc.toLocaleString()}원`;
            if (sumListEl) sumListEl.innerHTML = window.getReceivingSummaryHtml();
        };

        window.removeReceivingItem = function(bookId) {
            receivingItems = receivingItems.filter(i => i.bookId != bookId);
            window.updateTabContent();
        };

        window.handleReceivingSearch = function(val) {
            receivingSearch = val;
            window.updateReceivingSearchResults();
        };

        window.addReceivingItem = function(bookId) {
            if (!receivingUser) {
                window.showMessage("대상자를 먼저 선택하세요.", "error");
                return;
            }
            const b = booksList.find(x => x.id == bookId);
            if (b && !receivingItems.some(i => i.bookId == b.id)) {
                receivingItems.push({
                    bookId: b.id,
                    title: b.title,
                    category: b.category,
                    author: b.author,
                    originalPrice: Number(b.price) || 0,
                    actualPrice: Number(b.price) || 0
                });
                window.updateTabContent();
            }
        };

        window.handleConfirmReceiving = function() {
            if (!receivingUser) return;
            const roundTotal = receivingItems.reduce((sum, item) => sum + (Number(item.actualPrice) || 0), 0);

            usersList = usersList.map(u => {
                if (u.name === receivingUser) {
                    const newSpent = [...(u.spent || [0, 0, 0, 0])];
                    newSpent[receivingRound] = roundTotal;
                    const newStatus = [...(u.receivedStatus || [false, false, false, false])];
                    newStatus[receivingRound] = receivingItems.length > 0;
                    return { ...u, spent: newSpent, receivedStatus: newStatus };
                }
                return u;
            });

            booksList = booksList.map(b => {
                const newApps = (b.applicants || []).filter(a => {
                    if (typeof a === 'object') return !(a.name === receivingUser && a.round === receivingRound + 1);
                    return !(a === receivingUser && receivingRound === 0);
                });

                const recItem = receivingItems.find(i => i.bookId == b.id);
                if (recItem) {
                    const updatedPrice = Number(recItem.actualPrice) || 0;
                    newApps.push({
                        name: receivingUser,
                        round: receivingRound + 1,
                        actualPrice: updatedPrice
                    });
                    // 실제 단가를 도서 관리 기준 단가(price)에도 자동 반영
                    return { ...b, price: updatedPrice, applicants: newApps };
                }
                return { ...b, applicants: newApps };
            });

            window.loadReceivingItems(receivingUser, receivingRound);
            window.triggerAutoSave();
            window.updateTabContent();
            window.showMessage("구입 확정 및 도서 기준 단가 연동이 완료되었습니다.");
        };

        window.handleAddToCart = function(id) {
            if (!purchaseUser) {
                window.showMessage("대상자를 먼저 선택하세요.", "error");
                return;
            }
            const idx = cart.findIndex(i => i.book.id == id && i.userName === purchaseUser);
            if (idx > -1) {
                cart.splice(idx, 1);
            } else {
                const book = booksList.find(b => b.id == id);
                if (!book) return;
                const safeApplicants = book.applicants || [];
                if (safeApplicants.some(a => (typeof a === 'object' ? a.name : a) === purchaseUser)) {
                    window.showMessage("이미 구입한 도서입니다.", "error");
                    return;
                }
                cart.push({ userName: purchaseUser, round: purchaseRound, book: book });
            }
            window.updatePurchaseSidebar(window.getProcessedUsers());
            window.updatePurchaseBookList();
        };

        window.handleRemoveFromCart = function(userId, bookId) {
            const uObj = usersList.find(u => u.id == userId);
            const uName = uObj ? uObj.name : '';
            cart = cart.filter(i => !(i.book.id == bookId && i.userName === uName));
            window.updatePurchaseSidebar(window.getProcessedUsers());
            window.updatePurchaseBookList();
        };

        window.handleCompletePurchaseAction = function() {
            if (cart.length === 0) return;

            usersList = usersList.map(u => {
                const userCartItems = cart.filter(item => item.userName === u.name);
                if (userCartItems.length > 0) {
                    const ns = [...(u.spent || [0, 0, 0, 0])];
                    userCartItems.forEach(item => {
                        ns[item.round] = (ns[item.round] || 0) + (Number(item.book.price) || 0);
                    });
                    return { ...u, spent: ns };
                }
                return u;
            });

            booksList = booksList.map(b => {
                const bookCartItems = cart.filter(item => item.book.id == b.id);
                if (bookCartItems.length > 0) {
                    const newApplicants = [...(b.applicants || [])];
                    bookCartItems.forEach(item => {
                        if (!newApplicants.some(a => (typeof a === 'object' ? a.name : a) === item.userName)) {
                            newApplicants.push({ name: item.userName, round: item.round + 1, actualPrice: Number(b.price) || 0 });
                        }
                    });
                    return { ...b, applicants: newApplicants };
                }
                return b;
            });

            cart = [];
            window.triggerAutoSave();
            window.updateTabContent();
            window.showMessage("일괄 구입 신청이 완료되어 구글 시트에 자동 저장됩니다.");
        };

        // 14. 엑셀 업로드 & 다운로드 기능
        // ==========================================
        window.handleBookExcelDownload = function() {
            if (booksList.length === 0) { window.showMessage("다운로드할 도서가 없습니다.", "error"); return; }
            const data = booksList.map(b => ({
                "도서명": b.title,
                "가격": b.price,
                "출판일": b.date || "",
                "출판사": b.author || "",
                "카테고리": b.category
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "도서목록");
            XLSX.writeFile(wb, `문화누리카드_도서목록_${new Date().toISOString().slice(0, 10)}.xlsx`);
            window.showMessage("도서 목록 엑셀 다운로드 완료");
        };

        window.handleFileUpload = function(e) {
            const f = e.target.files[0];
            if (!f) return;

            const r = new FileReader();
            r.onload = (evt) => {
                try {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const rows = data.slice(1);

                    const excelBooks = [];
                    rows.forEach((row) => {
                        const t = String(row[0] || "").trim();
                        if (!t) return;
                        const p = Number(row[1] || 0);
                        let d = row[2];
                        if (typeof d === 'number') d = window.excelDateToJSDate(d);
                        else d = String(d || "").trim();
                        const a = String(row[3] || "").trim();
                        const c = CATEGORIES.includes(row[4]) ? row[4] : '교재';
                        excelBooks.push({ title: t, price: p, author: a, date: d, category: c });
                    });

                    if (excelBooks.length > 0) {
                        let updatedCount = 0;
                        let addedCount = 0;

                        const excelMap = new Map();
                        excelBooks.forEach(eb => {
                            if (!excelMap.has(eb.title) || (eb.date || "") > (excelMap.get(eb.title).date || "")) {
                                excelMap.set(eb.title, eb);
                            }
                        });

                        const existingMap = new Map();
                        booksList.forEach(b => {
                            if (!existingMap.has(b.title)) {
                                existingMap.set(b.title, b);
                            } else {
                                const curr = existingMap.get(b.title);
                                if ((b.date || "") > (curr.date || "")) {
                                    existingMap.set(b.title, {
                                        ...curr,
                                        price: b.price, author: b.author, date: b.date, category: b.category,
                                        applicants: [...(curr.applicants || []), ...(b.applicants || [])]
                                    });
                                }
                            }
                        });

                        let seq = 1;
                        excelMap.forEach((excelBook, title) => {
                            if (existingMap.has(title)) {
                                const curr = existingMap.get(title);
                                if ((excelBook.date || "") >= (curr.date || "")) {
                                    existingMap.set(title, {
                                        ...curr,
                                        price: excelBook.price,
                                        author: excelBook.author,
                                        date: excelBook.date,
                                        category: excelBook.category
                                    });
                                    updatedCount++;
                                }
                            } else {
                                existingMap.set(title, {
                                    id: Date.now() + (seq++),
                                    title: excelBook.title,
                                    price: excelBook.price,
                                    author: excelBook.author,
                                    date: excelBook.date,
                                    category: excelBook.category,
                                    applicants: []
                                });
                                addedCount++;
                            }
                        });

                        booksList = Array.from(existingMap.values());
                        booksList.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

                        window.triggerAutoSave();
                        window.updateTabContent();
                        window.showMessage(`총 ${addedCount}권 추가, ${updatedCount}권 업데이트 후 시트 자동 저장됨`);
                    } else {
                        window.showMessage("업로드할 유효한 도서 데이터가 없습니다.", "error");
                    }
                } catch (error) {
                    window.showMessage("엑셀 파일을 읽는 중 오류가 발생했습니다.", "error");
                }
            };
            r.readAsBinaryString(f);
            e.target.value = null;
        };

        window.handleExportUserStatusExcel = function() {
            const users = window.getProcessedUsers();
            if (users.length === 0) { window.showMessage("다운로드할 데이터가 없습니다.", "error"); return; }

            const data = users.map(u => ({
