        window.handleExportPurchaseListExcel = function() {
            const currentRound = activeTab === 'receiving' ? receivingRound : purchaseRound;
            const targetRounds = (activeTab === 'purchase' || activeTab === 'receiving') ? [currentRound + 1] : [1, 2, 3, 4];
            let exportData = [];

            targetRounds.forEach(r => {
                const families = [...new Set(usersList.map(u => u.family))].sort((a, b) => (a || '').localeCompare(b || ''));
                families.forEach(f => {
                    const familyUsers = usersList.filter(u => u.family === f).sort((a, b) => a.name.localeCompare(b.name));
                    familyUsers.forEach(u => {
                        const boughtInRound = booksList.filter(b =>
                            (b.applicants || []).some(app => {
                                if (typeof app === 'object') return app.name === u.name && app.round === r;
                                return app === u.name && r === 1;
                            })
                        );

                        boughtInRound.forEach(b => {
                            const app = (b.applicants || []).find(a => (typeof a === 'object' ? a.name === u.name && a.round === r : a === u.name && r === 1));
                            const prc = (typeof app === 'object' && app.actualPrice !== undefined) ? Number(app.actualPrice) : (Number(b.price) || 0);
                            exportData.push({
                                "차수": `${r}차`,
                                "가정": f || '미지정',
                                "성명": u.name,
                                "도서명": b.title,
                                "카테고리": b.category,
                                "출판사": b.author || '미상',
                                "단가": prc,
                                "출판일": b.date || ''
                            });
                        });
                    });
                });
            });

            if (exportData.length === 0) {
                window.showMessage("다운로드할 구입 내역이 없습니다.", "error");
                return;
            }

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "구입목록");
            const fileName = (activeTab === 'purchase' || activeTab === 'receiving')
                ? `문화누리카드_${currentRound + 1}차_도서구입목록_${new Date().toISOString().slice(0, 10)}.xlsx`
                : `문화누리카드_전체_도서구입목록_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(wb, fileName);
            window.showMessage("구입 목록 엑셀 다운로드 완료");
        };

        // ==========================================
        // 15. 인쇄 기능 (집행 현황, 최근 차수 신청 목록, 확정 구입 목록)
        // ==========================================
        window.handlePrintUserStatus = function() {
            const printArea = document.getElementById('print-area');
            const users = window.getProcessedUsers();

            let totalBudget = 0, totalSpent1 = 0, totalSpent2 = 0, totalSpent3 = 0, totalSpent4 = 0, totalSpentAll = 0, totalBalance = 0;

            const rowsHtml = users.map(u => {
                const b = u.budget || 0;
                const s1 = u.spent ? (u.spent[0] || 0) : 0;
                const s2 = u.spent ? (u.spent[1] || 0) : 0;
                const s3 = u.spent ? (u.spent[2] || 0) : 0;
                const s4 = u.spent ? (u.spent[3] || 0) : 0;
                const ts = u.totalSpent || 0;
                const bal = u.balance || 0;

                totalBudget += b; totalSpent1 += s1; totalSpent2 += s2; totalSpent3 += s3; totalSpent4 += s4; totalSpentAll += ts; totalBalance += bal;

                return `
                    <tr>
                        <td style="border: 1px solid black; white-space: nowrap;">${window.escapeHtml(u.family || '')}</td>
                        <td style="border: 1px solid black; font-weight:bold; white-space: nowrap;">${window.escapeHtml(u.name)}</td>
                        <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${b.toLocaleString()}</td>
                        <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${s1.toLocaleString()}</td>
                        <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${s2.toLocaleString()}</td>
                        <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${s3.toLocaleString()}</td>
                        <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${s4.toLocaleString()}</td>
                        <td style="border: 1px solid black; text-align:right; font-weight:bold; color: #059669; white-space: nowrap;">${ts.toLocaleString()}</td>
                        <td style="border: 1px solid black; text-align:right; font-weight:bold; color: #ea580c; white-space: nowrap;">${bal.toLocaleString()}</td>
                    </tr>
                `;
            }).join('');

            const totalRow = `
                <tr style="background-color: #f0f0f0; font-weight: bold;">
                    <td colspan="2" style="border: 1px solid black; text-align:center; white-space: nowrap;">총계</td>
                    <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${totalBudget.toLocaleString()}</td>
                    <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${totalSpent1.toLocaleString()}</td>
                    <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${totalSpent2.toLocaleString()}</td>
                    <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${totalSpent3.toLocaleString()}</td>
                    <td style="border: 1px solid black; text-align:right; white-space: nowrap;">${totalSpent4.toLocaleString()}</td>
                    <td style="border: 1px solid black; text-align:right; color: #059669; white-space: nowrap;">${totalSpentAll.toLocaleString()}</td>
                    <td style="border: 1px solid black; text-align:right; color: #ea580c; white-space: nowrap;">${totalBalance.toLocaleString()}</td>
                </tr>
            `;

            printArea.innerHTML = `
                <div class="family-section">
                    <h1>이용자별 집행 현황 보고서</h1>
                    <div class="print-header-info" style="justify-content: flex-end;">
                        <span>총 인원: ${users.length}명</span>
                    </div>
                    <table class="text-sm" style="border: 1.5px solid black; border-collapse: collapse; width: 100%;">
                        <thead>
                            <tr>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">가정</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">성명</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">지원금</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">1차</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">2차</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">3차</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">4차</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">총 지출액</th>
                                <th style="border: 1px solid black; background-color: #f0f0f0;">잔액</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                            ${totalRow}
                        </tbody>
                    </table>
                </div>
            `;
            window.print();
        };

        /**
         * 스마트 구입 신청: 가장 최근(최고) 차수의 확정 구입 내역을 '제 ( )차 도서 신청 목록' 양식으로 인쇄
         */
        window.handlePrintCart = function() {
            const printArea = document.getElementById('print-area');
            let maxRound = 0;

            booksList.forEach(book => {
                (book.applicants || []).forEach(app => {
                    const r = typeof app === 'object' ? app.round : 1;
                    if (r > maxRound) maxRound = r;
                });
            });

            if (maxRound === 0) {
                window.showMessage("인쇄할 최근 신청 내역(확정된 내역)이 없습니다.", "error");
                return;
            }

            const r = maxRound;
            let html = '';
            const families = [...new Set(usersList.map(u => u.family))].sort((a, b) => (a || '').localeCompare(b || ''));

            families.forEach(f => {
                const familyUsers = usersList.filter(u => u.family === f).sort((a, b) => a.name.localeCompare(b.name));
                let familyRows = '';

                familyUsers.forEach(u => {
                    const boughtInRound = booksList.filter(b =>
                        (b.applicants || []).some(app => {
                            if (typeof app === 'object') return app.name === u.name && app.round === r;
                            return app === u.name && r === 1;
                        })
                    );

                    if (boughtInRound.length > 0) {
                        boughtInRound.forEach((b, idx) => {
                            familyRows += `<tr>
                                ${idx === 0 ? `<td rowspan="${boughtInRound.length}" style="font-weight:bold; border: 1px solid black;">${window.escapeHtml(u.name)}</td>` : ''}
                                <td style="text-align:left; padding-left: 10px; border: 1px solid black;">${window.escapeHtml(b.title)}</td>
                                ${idx === 0 ? `<td rowspan="${boughtInRound.length}" style="border: 1px solid black;"></td>` : ''}
                            </tr>`;
                        });
                    }
                });

                if (familyRows) {
                    html += `<div class="family-section">
                        <h1>제 ${r}차 도서 신청 목록</h1>
                        <div class="print-header-info">
                            <span>가정명: ${window.escapeHtml(f || '미지정')}</span>
                            <span>신청 차수: ${r}차</span>
                        </div>
                        <table class="text-sm" style="border: 1.5px solid black; border-collapse: collapse; width: 100%;">
                            <thead>
                                <tr>
                                    <th width="20%" style="border: 1px solid black; background-color: #f0f0f0;">성명</th>
                                    <th width="65%" style="border: 1px solid black; background-color: #f0f0f0;">신청 도서명</th>
                                    <th width="15%" style="border: 1px solid black; background-color: #f0f0f0;">서명</th>
                                </tr>
                            </thead>
                            <tbody>${familyRows}</tbody>
                        </table>
                    </div>`;
                }
            });

            if (!html) {
                window.showMessage("해당 차수에 인쇄할 내역이 없습니다.", "error");
                return;
            }

            printArea.innerHTML = html;
            window.print();
        };

        window.handlePrintReport = function() {
            const printArea = document.getElementById('print-area');
            let html = '';

            const currentRound = activeTab === 'receiving' ? receivingRound : purchaseRound;
            const targetRounds = (activeTab === 'purchase' || activeTab === 'receiving') ? [currentRound + 1] : [1, 2, 3, 4];

            targetRounds.forEach(r => {
                let roundHtml = '';
                const families = [...new Set(usersList.map(u => u.family))].sort((a, b) => (a || '').localeCompare(b || ''));

                families.forEach(f => {
                    const familyUsers = usersList.filter(u => u.family === f).sort((a, b) => a.name.localeCompare(b.name));
                    let familyRows = '';

                    familyUsers.forEach(u => {
                        const boughtInRound = booksList.filter(b =>
                            (b.applicants || []).some(app => {
                                if (typeof app === 'object') return app.name === u.name && app.round === r;
                                return app === u.name && r === 1;
                            })
                        );

                        if (boughtInRound.length > 0) {
                            boughtInRound.forEach((b, idx) => {
                                familyRows += `<tr>
                                    ${idx === 0 ? `<td rowspan="${boughtInRound.length}" style="font-weight:bold; border: 1px solid black;">${window.escapeHtml(u.name)}</td>` : ''}
                                    <td style="text-align:left; padding-left: 10px; border: 1px solid black;">${window.escapeHtml(b.title)}</td>
                                    ${idx === 0 ? `<td rowspan="${boughtInRound.length}" style="border: 1px solid black;"></td>` : ''}
                                </tr>`;
                            });
                        }
                    });

                    if (familyRows) {
                        roundHtml += `<div class="family-section">
                            <h1>제 ${r}차 문화누리카드 도서구입목록</h1>
                            <div class="print-header-info">
                                <span>가정명: ${window.escapeHtml(f || '미지정')}</span>
                                <span>집행 차수: ${r}차</span>
                            </div>
                            <table class="text-sm" style="border: 1.5px solid black; border-collapse: collapse; width: 100%;">
                                <thead>
                                    <tr>
                                        <th width="20%" style="border: 1px solid black; background-color: #f0f0f0;">성명</th>
                                        <th width="65%" style="border: 1px solid black; background-color: #f0f0f0;">확정 도서명</th>
                                        <th width="15%" style="border: 1px solid black; background-color: #f0f0f0;">서명</th>
                                    </tr>
                                </thead>
                                <tbody>${familyRows}</tbody>
                            </table>
                        </div>`;
                    }
                });

                html += roundHtml;
            });

            if (!html) {
                window.showMessage("해당 차수에 인쇄할 확정 내역이 없습니다.", "error");
                return;
            }

            printArea.innerHTML = html;
            window.print();
        };

        // ==========================================
        // 16. 이용자 상세 보기 슬라이드 모달
        // ==========================================
        window.showUserDetail = function(id) {
            const u = window.getProcessedUsers().find(x => x.id == id);
            if (!u) return;
            const bought = booksList.filter(b => (b.applicants || []).some(a => (typeof a === 'object' ? a.name : a) === u.name));
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <button onclick="window.closeModal()" class="mb-4 w-fit bg-slate-100 p-2.5 rounded-full hover:bg-slate-200 transition-colors">
                    <i data-lucide="x" size="18"></i>
                </button>
                <div class="mb-6">
                    <span class="text-xs font-black text-emerald-600">${window.escapeHtml(u.family || '가정 미지정')}</span>
                    <h2 class="text-3xl font-black text-emerald-950">${window.escapeHtml(u.name)}</h2>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                        <p class="text-xs font-bold text-emerald-600 uppercase tracking-widest">지출</p>
                        <p class="text-xl font-black text-emerald-950 font-mono">${u.totalSpent.toLocaleString()}원</p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100">
                        <p class="text-xs font-bold text-orange-600 uppercase tracking-widest">잔액</p>
                        <p class="text-xl font-black text-orange-950 font-mono">${u.balance.toLocaleString()}원</p>
                    </div>
                </div>
                <div class="space-y-2 overflow-y-auto flex-1 pr-1 no-scrollbar">
                    ${bought.length === 0 ? '<div class="text-center py-12 text-slate-400 font-bold text-xs">구입 확정된 도서가 없습니다.</div>' : bought.map(b => {
                        const app = (b.applicants || []).find(a => (typeof a === 'object' ? a.name : a) === u.name);
                        const round = typeof app === 'object' ? (app.round || 1) : 1;
                        const prc = (typeof app === 'object' && app.actualPrice !== undefined) ? Number(app.actualPrice) : (Number(b.price) || 0);
                        return `
                            <div class="p-3.5 bg-slate-50 rounded-xl flex justify-between items-center font-bold text-xs border border-slate-100">
                                <div class="flex-1 min-w-0 pr-2">
                                    <span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-black mr-1">${round}차</span>
                                    <span class="truncate align-middle">${window.escapeHtml(b.title)}</span>
                                </div>
                                <span class="text-emerald-600 font-mono whitespace-nowrap">${prc.toLocaleString()}원</span>
                                <button onclick="window.handleCancelPurchase(${b.id}, ${u.id})" class="ml-2 px-2.5 py-1 bg-rose-100 text-rose-600 rounded-lg flex-shrink-0 text-[10px] hover:bg-rose-500 hover:text-white transition-colors">삭제</button>
                            </div>
                        `;
                    }).join('')}
                </div>
                <button onclick="window.closeModal()" class="mt-6 w-full py-4 bg-emerald-500 text-white rounded-3xl font-black hover:bg-emerald-600 transition-colors shadow-lg">확인 완료</button>
            `;

            document.getElementById('modal-container').classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-x-full'), 10);
            lucide.createIcons();
        };

        window.closeModal = function() {
            const content = document.getElementById('modal-content');
            content.classList.add('translate-x-full');
            setTimeout(() => document.getElementById('modal-container').classList.add('hidden'), 300);
        };
    </script>
</body>
</html>
